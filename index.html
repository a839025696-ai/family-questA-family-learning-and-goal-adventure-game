function save(){localStorage.setItem('lifeverseRealUI',JSON.stringify(state))}
function person(){return state.people[state.active]}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(en,zh=''){const t=document.getElementById('toast');t.innerHTML=esc(en)+(zh?'<small>'+esc(zh)+'</small>':'');t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1500)}

function renderPlayers(){document.getElementById('players').innerHTML=Object.entries(state.people).map(([name,p])=>`<button class="player ${name===state.active?'active':''}" data-player="${name}"><span class="face">${p.face}</span><span><b>${name}</b><small>Lv. ${p.level}</small></span></button>`).join('');document.querySelectorAll('[data-player]').forEach(b=>b.addEventListener('click',()=>{state.active=b.dataset.player;save();renderAll();toast('Now playing: '+state.active,'已切换角色')}));document.getElementById('hello').textContent=`${greeting()}, ${state.active}!`}
function xpPct(p){return Math.max(0,Math.min(100,Math.round(p.xp/p.next*100)))}
function todayDone(){return person().tasks.filter((_,i)=>state.done[state.active+'-'+i]).length}
function homeHTML(){const p=person();return `<div class="hero"><div class="world"><div class="world-copy"><div class="eyebrow">YOUR WORLD · YOUR QUEST</div><h3>A Better You.<br>A Bigger World.</h3><p>Learn · Explore · Serve · Grow · Belong<span class="zh">学习 · 探索 · 服务 · 成长 · 归属</span></p></div><div class="hero-avatar"><div class="portrait">${p.face}</div><div><h4>${state.active}</h4><small>${p.role} · ${p.zhRole}</small></div></div></div><div class="hudcard"><h3>${state.active} · Level ${p.level}</h3><div class="zhline">${p.zhRole}</div><div class="stats"><div class="stat"><strong>🪙 ${p.coins}</strong><small>COINS · 金币</small></div><div class="stat"><strong>💎 ${p.gems}</strong><small>GEMS · 宝石</small></div><div class="stat"><strong>🔥 ${p.streak}</strong><small>DAY STREAK · 连续天数</small></div><div class="stat"><strong>${todayDone()}/${p.tasks.length}</strong><small>QUESTS · 今日任务</small></div></div><div class="xpbar"><span style="width:${xpPct(p)}%"></span></div><div class="xplabel"><span>XP</span><span>${p.xp} / ${p.next}</span></div></div></div>
<div class="section-grid"><div class="card"><div class="card-head"><div><h3>Today's Quests</h3><small>今日任务</small></div><button class="linkbtn" data-go="quests">See all →</button></div>${p.tasks.slice(0,4).map((t,i)=>taskRow(t,i)).join('')}</div><div class="card"><div class="card-head"><div><h3>Goal Map</h3><small>目标地图</small></div><button class="linkbtn" data-go="goals">Open →</button></div><div class="map-mini"><div class="river"></div><div class="route"></div>${p.goals.map((g,i)=>`<button class="map-node ${g[3]} m${i+1}" data-go="goals" title="${esc(g[0])}">${g[2]}</button>`).join('')}</div></div><div class="card"><div class="card-head"><div><h3>Weekly Progress</h3><small>本周进度</small></div></div><div class="week">${[['Learning',70],['Health',60],['Service',40],['Family',80]].map(x=>`<div class="week-row"><b>${x[0]}</b><div class="weekbar"><span style="width:${x[1]}%"></span></div><strong>${x[1]}%</strong></div>`).join('')}</div></div></div>
<div class="tiles"><button class="tile" data-go="skills"><span class="big">📚</span><h4>Skills</h4><small>技能 · Learn and level up</small></button><button class="tile" data-go="assets"><span class="big">🏆</span><h4>Growth Assets</h4><small>成长资产 · What you've earned</small></button><button class="tile" data-go="shop"><span class="big">🏪</span><h4>Reward Shop</h4><small>奖励商店 · Spend your coins</small></button><button class="tile" data-go="family"><span class="big">👨‍👩‍👦‍👦</span><h4>Family Center</h4><small>家庭中心 · Grow together</small></button></div>`}
function taskRow(t,i){const done=!!state.done[state.active+'-'+i];return `<div class="task"><button class="${done?'done':''}" data-task="${i}">${done?'✓':''}</button><div><b>${esc(t[0])}</b><small>${esc(t[1])}</small></div><div class="reward">+${t[3]} 🪙 · +${t[4]} XP</div></div>`}
function title(en,zh){return `<div class="panel-title"><div><h2>${en}</h2><small>${zh}</small></div><button class="backhome" data-go="home">← Home</button></div>`}
function questsHTML(){const p=person();return title('Quest Hall','任务大厅')+`<div class="quest-grid">${p.tasks.map((t,i)=>{const d=!!state.done[state.active+'-'+i];return `<div class="quest-card"><div class="icon">${t[2]}</div><h3>${esc(t[0])}</h3><p>${esc(t[1])}</p><div class="reward">+${t[4]} XP · +${t[3]} Coins</div><br><button class="action ${d?'gold':''}" data-task="${i}">${d?'Completed ✓':'Complete Quest'}</button></div>`}).join('')}</div>`}
function goalsHTML(){const p=person();return title('Goal Map','目标地图')+`<div class="goalmap"><div class="route"></div>${p.goals.map((g,i)=>`<div class="goal-node ${g[3]} g${i+1}"><div class="icon">${g[2]}</div><b>${esc(g[0])}</b><small>${esc(g[1])}</small><br><br><span class="level">${g[3]==='done'?'CLEARED':g[3]==='current'?'CURRENT QUEST':'LOCKED'}</span></div>`).join('')}</div>`}
function skillsHTML(){const p=person();return title('Skill Tree','技能树')+`<div class="skills-grid">${p.skills.map(s=>`<div class="skill-card"><div class="icon">${s[2]}</div><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p><div class="level">LEVEL ${s[3]}</div><div class="bar"><span style="width:${s[4]}%"></span></div></div>`).join('')}</div>`}
function assetsHTML(){const p=person();return title('Growth Assets','成长资产')+`<div class="skills-grid"><div class="skill-card"><div class="icon">⭐</div><h3>${p.level*250+p.xp} Growth Points</h3><p>成长积分</p></div><div class="skill-card"><div class="icon">🪙</div><h3>${p.coins} Coins</h3><p>金币</p></div><div class="skill-card"><div class="icon">💎</div><h3>${p.gems} Gems</h3><p>宝石</p></div><div class="skill-card"><div class="icon">🔥</div><h3>${p.streak} Day Streak</h3><p>连续打卡</p></div><div class="skill-card"><div class="icon">🎖️</div><h3>${Math.max(1,p.level-1)} Badges</h3><p>徽章</p></div><div class="skill-card"><div class="icon">🎁</div><h3>${state.purchases.length} Rewards</h3><p>已兑换奖励</p></div></div>`}
function shopHTML(){const p=person();return title('Reward Shop','奖励商店')+`<div class="shop-grid">${rewards.map((r,i)=>`<div class="shop-item"><div class="icon">${r[2]}</div><h3>${r[0]}</h3><p>${r[1]}</p><button class="action gold" data-buy="${i}" ${p.coins<r[3]?'disabled':''}>🪙 ${r[3]} · Redeem</button></div>`).join('')}</div>`}
function familyHTML(){return title('Family Center','家庭中心')+`<div class="family-grid">${Object.entries(state.people).map(([name,p])=>`<div class="member-card ${name===state.active?'active':''}" data-member="${name}"><div class="face">${p.face}</div><h3>${name}</h3><small>${p.role}<br>${p.zhRole}<br>Level ${p.level}</small></div>`).join('')}</div>`}
function lifeHTML(){const p=person();return title('My Life','我的人生')+`<div class="hero"><div class="card"><div class="eyebrow">CURRENT CHAPTER</div><h2>${p.role}</h2><p style="color:#a8bdd2;font-size:11px">${p.zhRole}</p><div class="xpbar"><span style="width:${xpPct(p)}%"></span></div><div class="xplabel"><span>Life Level ${p.level}</span><span>${p.xp}/${p.next} XP</span></div></div><div class="card"><div class="eyebrow">NEXT MILESTONE</div><h3>Reach Level ${p.level+1}</h3><small style="color:#8ea7c0">继续完成任务，解锁下一阶段。</small></div></div>`}
function renderPage(id){const el=document.getElementById(id);if(id==='home')el.innerHTML=homeHTML();if(id==='quests')el.innerHTML=questsHTML();if(id==='goals')el.innerHTML=goalsHTML();if(id==='skills')el.innerHTML=skillsHTML();if(id==='assets')el.innerHTML=assetsHTML();if(id==='shop')el.innerHTML=shopHTML();if(id==='family')el.innerHTML=familyHTML();if(id==='life')el.innerHTML=lifeHTML();bindPage(id)}
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));renderPage(id);window.scrollTo({top:0,behavior:'smooth'})}
function completeTask(i){const p=person(),k=state.active+'-'+i,t=p.tasks[i];if(!state.done[k]){state.done[k]=true;p.xp+=t[4];p.coins+=t[3];if(p.xp>=p.next){p.xp-=p.next;p.level++;p.next=Math.round(p.next*1.22);toast('LEVEL UP!','升级了！')}else toast('Quest complete!','任务完成');}else{state.done[k]=false;p.xp=Math.max(0,p.xp-t[4]);p.coins=Math.max(0,p.coins-t[3]);toast('Quest unchecked','已取消完成')}save();renderAll()}
function buy(i){const p=person(),r=rewards[i];if(p.coins<r[3])return toast('Not enough coins','金币不足');p.coins-=r[3];state.purchases.push({player:state.active,reward:r[0],at:Date.now()});save();renderAll();toast('Reward unlocked!','奖励已兑换')}
function bindPage(id){document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.go)));document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('click',()=>completeTask(+b.dataset.task)));document.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>buy(+b.dataset.buy)));document.querySelectorAll('[data-member]').forEach(b=>b.addEventListener('click',()=>{state.active=b.dataset.member;save();renderAll();showPage('family');toast('Now playing: '+state.active,'已切换角色')}))}
function renderAll(){renderPlayers();const active=document.querySelector('.page.active')?.id||'home';renderPage(active)}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
renderPlayers();renderPage('home');
</script>
</body>
</html>

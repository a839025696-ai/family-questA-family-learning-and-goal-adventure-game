<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeVerse — Level up your real life.</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">∞</div>
        <div>
          <h1>LifeVerse</h1>
          <p>Level up your real life.</p>
        </div>
      </div>

      <nav class="nav-list">
        <button class="nav-item active" data-view="home">◉ My Life</button>
        <button class="nav-item" data-view="roadmap">⌁ 人生路线</button>
        <button class="nav-item" data-view="tasks">✓ 今日任务</button>
        <button class="nav-item" data-view="mom">◇ Family</button>
      </nav>

      <div class="sidebar-note">
        <strong>Human Level 1 → 10,000</strong>
        <p>现实中的每一次成长，都在塑造你的另一段人生。</p>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <p class="eyebrow">LIFEVERSE · PRIVATE PROTOTYPE</p>
          <h2 id="pageTitle">今天，继续你的人生。</h2>
        </div>
        <div class="character-switcher" id="characterSwitcher"></div>
      </header>

      <section id="homeView" class="view active"></section>
      <section id="roadmapView" class="view"></section>
      <section id="tasksView" class="view"></section>
      <section id="momView" class="view"></section>
    </main>
  </div>

  <template id="statCardTemplate">
    <div class="stat-card">
      <div class="stat-icon"></div>
      <div>
        <p class="stat-label"></p>
        <strong class="stat-value"></strong>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>

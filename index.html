<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#03112f"/>
<title>LifeVerse — Level Up Your Real Life</title>
<style>
:root{--cyan:#59e7ff;--blue:#1d7dff;--violet:#8b5cff;--gold:#ffd45b;--bg:#020b20;--panel:rgba(4,18,58,.95);--line:rgba(87,220,255,.42);--muted:#98add4;--green:#34dfaa}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{overflow:hidden}button{font:inherit;color:inherit}
.app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 70% 20%,#153b8d 0,#071b49 28%,#020b20 68%)}
.stage{position:relative;width:min(100vw,calc(100vh * 1.5));height:min(100vh,calc(100vw / 1.5));aspect-ratio:3/2;overflow:hidden;background:#06163c;box-shadow:0 0 80px rgba(0,160,255,.24)}
.concept{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}.fallback{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#03102c,#0a2c6f 55%,#120a41);text-align:center}.concept.loaded+.fallback{display:none}.fallback h1{font-size:clamp(44px,8vw,110px);margin:0;text-shadow:0 0 28px #00cfff}.fallback p{color:#b8cbef}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:20px;outline:none;z-index:4}.hotspot:hover,.hotspot:focus-visible{box-shadow:inset 0 0 0 2px rgba(75,220,255,.82),0 0 24px rgba(0,190,255,.35);background:rgba(0,180,255,.05)}
.home{left:1%;top:10%;width:12%;height:6%}.mylife{left:1%;top:17%;width:12%;height:5%}.tasks{left:1%;top:23%;width:12%;height:5%}.goals{left:1%;top:29%;width:12%;height:5%}.skills{left:1%;top:35%;width:12%;height:5%}.assets{left:1%;top:41%;width:12%;height:5%}.shop{left:1%;top:47%;width:12%;height:5%}.family{left:1%;top:53%;width:12%;height:5%}.rina{left:35%;top:1%;width:8%;height:7%}.roy{left:44%;top:1%;width:8%;height:7%}.alex{left:53%;top:1%;width:8%;height:7%}.leo{left:62%;top:1%;width:8%;height:7%}.start{left:55%;top:54%;width:12%;height:10%}.goalcard{left:14.5%;top:72%;width:18%;height:22%}.assetcard{left:33%;top:72%;width:22%;height:22%}.shopcard{left:56%;top:72%;width:19%;height:22%}.familycard{left:76%;top:72%;width:22%;height:22%}
.hud{position:absolute;right:1.3%;top:1.4%;z-index:6;display:flex;gap:7px;pointer-events:none}.chip{padding:7px 10px;border:1px solid rgba(89,231,255,.34);border-radius:12px;background:rgba(1,11,38,.76);backdrop-filter:blur(8px);font-weight:800;font-size:12px}.chip small{display:block;color:#8faee1;font-size:8px;font-weight:500}.coin strong{color:var(--gold)}
.screen{position:absolute;inset:0;z-index:12;background:radial-gradient(circle at 80% 10%,rgba(50,63,180,.32),transparent 26%),linear-gradient(145deg,rgba(3,11,38,.98),rgba(4,26,71,.985));transform:translateX(102%);transition:.35s ease;overflow:auto;padding:28px 34px 36px}.screen.show{transform:translateX(0)}
.screen-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.back{border:1px solid var(--line);background:rgba(12,55,121,.55);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:800}.back:hover{box-shadow:0 0 18px rgba(68,210,255,.28)}.titlebox h2{margin:0;font-size:31px;letter-spacing:.2px}.zh{display:block;font-size:10px;color:#8faee1;font-weight:500;margin-top:3px}.eyebrow{font-size:10px;color:#65e7ff;letter-spacing:1.5px;text-transform:uppercase;font-weight:900;margin-bottom:6px}
.hero-row{display:grid;grid-template-columns:1.4fr .9fr;gap:14px;margin-bottom:16px}.hero-card,.glass{border:1px solid var(--line);background:linear-gradient(180deg,rgba(15,53,119,.74),rgba(6,22,63,.78));border-radius:22px;box-shadow:inset 0 0 30px rgba(74,166,255,.05),0 0 28px rgba(0,132,255,.12)}.hero-card{padding:18px}.playerline{display:flex;align-items:center;gap:14px}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,#6447ff,#12cfff);box-shadow:0 0 22px rgba(77,184,255,.36)}.playerline h3{margin:0;font-size:22px}.meta{font-size:11px;color:#a7bce2}.progress{height:9px;border-radius:999px;background:rgba(126,160,223,.2);overflow:hidden;margin-top:10px}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#43e8ff,#7b5cff);border-radius:inherit}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:14px}.stat{border:1px solid rgba(110,195,255,.18);background:rgba(16,45,99,.68);border-radius:14px;padding:11px}.stat b{font-size:19px}.stat small{display:block;font-size:9px;color:#8faee1;margin-top:2px}
.tasklist{display:grid;gap:9px}.task{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:11px;padding:13px 14px;border:1px solid rgba(100,190,255,.19);border-radius:15px;background:rgba(10,38,90,.66)}.check{width:28px;height:28px;border-radius:8px;border:1px solid #63ddff;background:rgba(0,120,255,.18);cursor:pointer;font-weight:900}.check.done{background:var(--green);border-color:var(--green)}.task.done{opacity:.62}.task.done .task-name{text-decoration:line-through}.task-name{font-weight:800}.reward{font-size:11px;color:var(--gold);font-weight:900}
.map{position:relative;min-height:520px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:radial-gradient(circle at 70% 25%,rgba(57,88,210,.48),transparent 28%),linear-gradient(160deg,#07184d,#102c67 58%,#071533)}.map:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 75%,rgba(53,224,255,.14),transparent 22%),radial-gradient(circle at 55% 60%,rgba(158,86,255,.14),transparent 24%)}.path{position:absolute;left:13%;right:13%;top:49%;height:4px;background:linear-gradient(90deg,#26e5ff,#7b5cff,#ff74e6);box-shadow:0 0 15px rgba(76,215,255,.5)}.node{position:absolute;width:136px;min-height:104px;border:1px solid rgba(95,216,255,.5);background:rgba(4,23,67,.9);border-radius:20px;padding:13px;text-align:center;box-shadow:0 0 24px rgba(50,180,255,.16)}.node.current{border-color:#5af0ff;box-shadow:0 0 32px rgba(58,224,255,.4)}.node.done{border-color:#3fe0aa}.node.locked{opacity:.48;filter:saturate(.5)}.node .icon{font-size:27px}.node b{display:block;font-size:12px;margin-top:5px}.node small{font-size:9px;color:#91a9d2}.n1{left:8%;top:58%}.n2{left:30%;top:34%}.n3{left:53%;top:57%}.n4{right:8%;top:30%}
.skilltree{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.skill{min-height:175px;padding:16px;border-radius:20px;border:1px solid rgba(97,203,255,.22);background:linear-gradient(160deg,rgba(16,49,106,.86),rgba(11,25,69,.9));position:relative}.skill .icon{font-size:34px}.skill h3{margin:9px 0 2px}.skill p{color:#95add7;font-size:10px}.skill-level{position:absolute;right:12px;top:12px;padding:4px 8px;border-radius:999px;background:rgba(84,105,255,.28);font-size:10px}.mini-bar{height:7px;border-radius:99px;background:rgba(145,166,220,.16);overflow:hidden;margin-top:12px}.mini-bar span{display:block;height:100%;background:linear-gradient(90deg,#29e5ff,#8b5cff)}
.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.item{padding:17px;border-radius:19px;border:1px solid rgba(110,195,255,.2);background:rgba(15,44,98,.74)}.item .icon{font-size:34px}.item h3{margin:9px 0 2px}.item p{font-size:10px;color:#94abd2;min-height:28px}.buy{width:100%;padding:10px;border-radius:11px;border:1px solid rgba(255,215,91,.45);background:rgba(160,114,0,.22);color:#ffe07c;cursor:pointer;font-weight:900}.buy:disabled{opacity:.35;cursor:not-allowed}
.familygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.member{padding:18px;border:1px solid rgba(102,196,255,.2);border-radius:18px;background:rgba(12,41,91,.68);text-align:center;cursor:pointer}.member .avatar{margin:0 auto 10px}.member.active{border-color:#5deaff;box-shadow:0 0 24px rgba(54,212,255,.28)}
.toast{position:absolute;left:50%;bottom:4%;z-index:30;transform:translate(-50%,30px);padding:12px 20px;border:1px solid rgba(71,222,255,.75);border-radius:14px;background:rgba(3,16,48,.95);backdrop-filter:blur(12px);box-shadow:0 0 26px rgba(0,195,255,.35);font-weight:800;opacity:0;pointer-events:none;transition:.22s;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.toast small{display:block;color:#9db5df;font-size:9px;font-weight:500}
.rotate{display:none;position:fixed;inset:0;z-index:50;background:#020b20;color:#fff;align-items:center;justify-content:center;text-align:center;padding:30px}.rotate strong{display:block;font-size:24px}.rotate span{display:block;color:#8faee1;font-size:11px;margin-top:5px}
@media(max-width:950px){.screen{padding:20px}.titlebox h2{font-size:24px}.hero-row{grid-template-columns:1fr}.skilltree,.shopgrid{grid-template-columns:repeat(2,1fr)}.familygrid{grid-template-columns:repeat(2,1fr)}}
@media(orientation:portrait) and (max-width:700px){.rotate{display:flex}.stage{opacity:.1}}
</style>
</head>
<body>
<div class="app"><div class="stage">
<img class="concept" src="lifeverse-dashboard.png" alt="LifeVerse game home" onload="this.classList.add('loaded')"/>
<div class="fallback"><div><h1>∞ LifeVerse</h1><p>A Better Me. A Brighter Tomorrow.</p></div></div>
<div class="hud"><div class="chip"><strong id="hudName">Alex</strong><small>PLAYER · 玩家</small></div><div class="chip"><strong id="hudLevel">Lv. 4</strong><small>LEVEL · 等级</small></div><div class="chip coin"><strong id="hudCoins">145</strong><small>COINS · 金币</small></div></div>
<button class="hotspot home" data-action="home"></button><button class="hotspot mylife" data-action="profile"></button><button class="hotspot tasks" data-action="tasks"></button><button class="hotspot goals" data-action="goals"></button><button class="hotspot skills" data-action="skills"></button><button class="hotspot assets" data-action="assets"></button><button class="hotspot shop" data-action="shop"></button><button class="hotspot family" data-action="family"></button>
<button class="hotspot rina" data-player="Rina"></button><button class="hotspot roy" data-player="Roy"></button><button class="hotspot alex" data-player="Alex"></button><button class="hotspot leo" data-player="Leo"></button>
<button class="hotspot start" data-action="tasks"></button><button class="hotspot goalcard" data-action="goals"></button><button class="hotspot assetcard" data-action="assets"></button><button class="hotspot shopcard" data-action="shop"></button><button class="hotspot familycard" data-action="family"></button>
<section class="screen" id="screen"></section><div class="toast" id="toast"></div>
</div></div>
<div class="rotate"><div><strong>Turn your phone sideways</strong><span>请横屏使用，才能看到完整游戏界面。</span></div></div>
<script>
const defaults={Alex:{avatar:'🧑‍🚀',title:'Science Explorer',zhTitle:'科学探索者',level:4,xp:320,next:500,coins:145,streak:6,tasks:[['Reading · 20 min','阅读 · 20分钟',10,5],['Math Focus · 25 min','数学专注 · 25分钟',15,6],['Science Discovery','科学探索',15,7],['Organize Backpack','整理书包',8,4]],goals:[['Build a steady study habit','建立稳定学习习惯','done'],['Science Exploration · Lv.1','科学探索 · 第1阶段','current'],['History & Finance','历史与金融','locked'],['Future Career Explorer','未来职业探索','locked']],skills:[['Science','科学',3,68,'🔬'],['History','历史',2,42,'🏛️'],['Finance','金融',1,25,'💰'],['Rowing','赛艇',2,51,'🚣'],['Tuba','大号',2,39,'🎺'],['English','英语',3,61,'📘']]},Leo:{avatar:'🦖',title:'Dino Code Adventurer',zhTitle:'恐龙代码勇士',level:3,xp:210,next:400,coins:118,streak:4,tasks:[['Reading · 15 min','阅读 · 15分钟',10,5],['Math Focus · 20 min','数学专注 · 20分钟',12,5],['Animal Discovery','动物知识探索',15,7],['Move · 30 min','运动 · 30分钟',10,5]],goals:[['Build a steady study habit','建立稳定学习习惯','done'],['Animals & Paleontology · Lv.1','动物与古生物 · 第1阶段','current'],['Coding Adventure','编程冒险','locked'],['AI & Cyber World','AI与网络世界','locked']],skills:[['Animals','动物',3,70,'🐾'],['Paleontology','古生物',2,54,'🦴'],['Coding','编程',1,31,'💻'],['AI','人工智能',1,18,'🤖'],['Soccer','足球',2,47,'⚽'],['English','英语',2,49,'📘']]},Rina:{avatar:'👩',title:'Creator & Planner',zhTitle:'创建者 · 规划者',level:1,xp:0,next:100,coins:1250,streak:0,tasks:[['Plan family quests','规划家庭任务',10,5],['Review weekly progress','查看本周进度',10,5]],goals:[['Build a better family system','建立更好的家庭成长系统','current']],skills:[['Planning','规划',4,80,'🗺️'],['Creativity','创造力',4,76,'✨'],['Support','支持',3,69,'💙']]},Roy:{avatar:'👨',title:'Supporter & Adventurer',zhTitle:'支持者 · 冒险者',level:1,xp:0,next:100,coins:0,streak:0,tasks:[['Family support','家庭支持',10,5],['Exercise','运动',10,5]],goals:[['Grow together','一起成长','current']],skills:[['Support','支持',3,62,'🤝'],['Adventure','探索',2,47,'🧭'],['Fitness','运动',2,45,'🏃']]}};
let state=JSON.parse(localStorage.getItem('lifeverseGameV3')||'null')||{player:'Alex',players:structuredClone(defaults),done:{}};const save=()=>localStorage.setItem('lifeverseGameV3',JSON.stringify(state));const p=()=>state.players[state.player];
function hud(){document.getElementById('hudName').textContent=state.player;document.getElementById('hudLevel').textContent='Lv. '+p().level;document.getElementById('hudCoins').textContent=p().coins}
function toast(en,zh=''){const t=document.getElementById('toast');t.innerHTML=en+(zh?`<small>${zh}</small>`:'');t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1500)}
function profileBlock(){const x=p(),pct=Math.min(100,Math.round(x.xp/x.next*100));return `<div class="hero-row"><div class="hero-card"><div class="playerline"><div class="avatar">${x.avatar}</div><div><h3>${state.player}</h3><div class="meta">${x.title}<span class="zh">${x.zhTitle}</span></div></div></div><div class="progress"><span style="width:${pct}%"></span></div><div class="meta" style="margin-top:7px">${x.xp} / ${x.next} XP · ${pct}%</div></div><div class="glass statgrid"><div class="stat"><b>Lv. ${x.level}</b><small>LEVEL · 等级</small></div><div class="stat"><b>${x.coins}</b><small>COINS · 金币</small></div><div class="stat"><b>${x.streak}</b><small>STREAK · 连续</small></div><div class="stat"><b>${Object.values(state.done).filter(Boolean).length}</b><small>QUESTS · 已完成</small></div></div></div>`}
function openScreen(type){if(type==='home'){closeScreen();return}const s=document.getElementById('screen');s.innerHTML=render(type);s.classList.add('show');bind(type)}function closeScreen(){document.getElementById('screen').classList.remove('show')}
function head(en,zh){return `<div class="screen-top"><div><div class="eyebrow">LIFEVERSE · JOURNEY</div><div class="titlebox"><h2>${en}<span class="zh">${zh}</span></h2></div></div><button class="back" id="backBtn">← Home<span class="zh">返回首页</span></button></div>`}
function render(type){if(type==='tasks'){const rows=p().tasks.map((t,i)=>{const k=state.player+'-'+i,d=!!state.done[k];return `<div class="task ${d?'done':''}"><button class="check ${d?'done':''}" data-task="${i}">${d?'✓':''}</button><div class="task-name">${t[0]}<span class="zh">${t[1]}</span></div><div class="reward">+${t[2]} XP · +${t[3]} 🪙</div></div>`}).join('');return head('Quest Hall','任务大厅')+profileBlock()+`<div class="glass" style="padding:16px"><div class="eyebrow">TODAY'S QUESTS</div><div class="tasklist">${rows}</div></div>`}
if(type==='goals'){const g=p().goals,n=g.map((x,i)=>`<div class="node n${i+1} ${x[2]}"><div class="icon">${x[2]==='done'?'✅':x[2]==='current'?'⚡':'🔒'}</div><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');return head('Goal Map','目标地图')+profileBlock()+`<div class="map"><div class="path"></div>${n}</div>`}
if(type==='skills'||type==='assets'){const skills=p().skills||[];return head(type==='skills'?'Skill Tree':'Growth Assets',type==='skills'?'技能树':'成长资产')+profileBlock()+`<div class="skilltree">${skills.map(s=>`<div class="skill"><div class="skill-level">Lv. ${s[2]}</div><div class="icon">${s[4]}</div><h3>${s[0]}<span class="zh">${s[1]}</span></h3><p>Keep practicing to unlock the next level.<span class="zh">继续练习以解锁下一等级。</span></p><div class="mini-bar"><span style="width:${s[3]}%"></span></div></div>`).join('')}</div>`}
if(type==='shop'){const items=[['🎮','30 min Game Time','30分钟游戏时间',60],['🍦','Favorite Treat','喜欢的小点心',40],['🎬','Movie Choice','选择家庭电影',80],['🎁','Mystery Reward','神秘奖励',120],['🧭','Family Adventure','家庭小冒险',180],['⭐','Bonus Privilege','特别权限',150]];return head('Reward Shop','奖励商店')+profileBlock()+`<div class="shopgrid">${items.map((it,i)=>`<div class="item"><div class="icon">${it[0]}</div><h3>${it[1]}<span class="zh">${it[2]}</span></h3><p>Spend coins you earned from real-life quests.</p><button class="buy" data-buy="${i}" ${p().coins<it[3]?'disabled':''}>${it[3]} Coins<span class="zh">${it[3]} 金币</span></button></div>`).join('')}</div>`}
if(type==='family'||type==='profile'){return head(type==='family'?'Family Center':'My Life',type==='family'?'家庭中心':'我的人生')+profileBlock()+`<div class="familygrid">${Object.keys(state.players).map(n=>{const x=state.players[n];return `<div class="member ${state.player===n?'active':''}" data-member="${n}"><div class="avatar">${x.avatar}</div><b>${n}</b><span class="zh">${x.zhTitle}</span></div>`}).join('')}</div>`}
return head('Coming Soon','即将上线')+profileBlock()+`<div class="hero-card"><h3>More adventures are coming.</h3><span class="zh">更多成长冒险正在制作中。</span></div>`}
function bind(type){document.getElementById('backBtn').onclick=closeScreen;document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const i=+b.dataset.task,k=state.player+'-'+i,t=p().tasks[i];if(!state.done[k]){state.done[k]=true;p().xp+=t[2];p().coins+=t[3];if(p().xp>=p().next){p().xp-=p().next;p().level++;p().next=Math.round(p().next*1.25);toast('LEVEL UP!','升级了！')}else toast('Quest complete!','任务完成');save();hud();openScreen('tasks')}else{state.done[k]=false;save();openScreen('tasks')}});document.querySelectorAll('[data-member]').forEach(b=>b.onclick=()=>{state.player=b.dataset.member;save();hud();toast('Switched to '+state.player,'已切换角色');openScreen(type)});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const costs=[60,40,80,120,180,150],c=costs[+b.dataset.buy];if(p().coins>=c){p().coins-=c;save();hud();toast('Reward unlocked!','奖励已解锁');openScreen('shop')}})}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>openScreen(b.dataset.action));document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>{state.player=b.dataset.player;save();hud();toast('Now playing: '+state.player,'当前角色：'+state.player)});hud();
</script>
</body></html>

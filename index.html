function avatar(name){const leo=name==='Leo';return `<svg viewBox="0 0 80 80"><defs><linearGradient id="g${name}" x1="0" x2="1"><stop stop-color="${leo?'#a9e7c7':'#a9d7ff'}"/><stop offset="1" stop-color="${leo?'#c9f0b9':'#d8c2ff'}"/></linearGradient></defs><circle cx="40" cy="40" r="39" fill="url(#g${name})"/><path d="M18 34c2-19 42-25 47-1-5-3-10-4-15-2-8-8-18-4-24 4-4 1-6 0-8-1z" fill="${leo?'#70533f':'#2d2b37'}"/><ellipse cx="40" cy="43" rx="20" ry="22" fill="#ffe1cf"/><path d="M23 33c3-17 32-23 40-5-8-5-14-1-19-7-4 6-12 5-21 12z" fill="${leo?'#6c513e':'#292735'}"/><ellipse cx="33" cy="43" rx="2.8" ry="4" fill="#3e3a46"/><ellipse cx="48" cy="43" rx="2.8" ry="4" fill="#3e3a46"/><path d="M35 53c4 3 8 3 12 0" fill="none" stroke="#d27e84" stroke-width="2" stroke-linecap="round"/><path d="M27 61c7 8 20 9 28 0l7 17H18z" fill="${leo?'#67b98b':'#4e86d7'}"/><circle cx="25" cy="48" r="3" fill="#ffb0a8" opacity=".55"/><circle cx="55" cy="48" r="3" fill="#ffb0a8" opacity=".55"/></svg>`}
function scene(){return `<svg viewBox="0 0 900 430" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bfe8ff"/><stop offset="1" stop-color="#f7fcff"/></linearGradient><linearGradient id="water" x1="0" x2="1"><stop stop-color="#7ed5f6"/><stop offset="1" stop-color="#5fbce8"/></linearGradient></defs><rect width="900" height="430" fill="url(#sky)"/><g fill="#fff" opacity=".8"><ellipse cx="150" cy="70" rx="70" ry="26"/><ellipse cx="215" cy="75" rx="55" ry="22"/><ellipse cx="650" cy="60" rx="80" ry="28"/></g><path d="M0 290C140 245 240 270 350 250c130-23 245-12 550 25v155H0z" fill="url(#water)"/><g><ellipse cx="590" cy="255" rx="235" ry="120" fill="#b7e4be"/><ellipse cx="590" cy="270" rx="190" ry="85" fill="#d7f1c9"/><ellipse cx="720" cy="145" rx="120" ry="70" fill="#b9e6c2"/><ellipse cx="410" cy="190" rx="145" ry="85" fill="#c2ebcb"/></g><g transform="translate(610 105)"><rect x="0" y="35" width="150" height="95" rx="20" fill="#fff" stroke="#c9e5f5" stroke-width="5"/><path d="M25 35 75 0l50 35" fill="#8ac9ff"/><rect x="55" y="72" width="40" height="58" rx="7" fill="#76b8e9"/><circle cx="75" cy="45" r="13" fill="#a7e0ff"/></g><g transform="translate(360 138)"><rect x="0" y="40" width="130" height="90" rx="16" fill="#fff8e7" stroke="#efd9a9" stroke-width="4"/><path d="M10 40 65 5l55 35" fill="#f0b36b"/><rect x="52" y="78" width="28" height="52" rx="6" fill="#b57f5f"/><rect x="18" y="62" width="23" height="23" rx="5" fill="#9bd9ff"/><rect x="92" y="62" width="23" height="23" rx="5" fill="#9bd9ff"/></g><g transform="translate(760 238)"><rect x="0" y="35" width="110" height="75" rx="14" fill="#fff" stroke="#d9c5ff" stroke-width="4"/><path d="M12 35 55 7l43 28" fill="#c1a4ff"/><rect x="42" y="68" width="26" height="42" rx="5" fill="#8d76c5"/></g><g fill="#f3a8c4"><circle cx="520" cy="205" r="18"/><circle cx="545" cy="194" r="14"/><circle cx="330" cy="230" r="16"/><circle cx="790" cy="200" r="17"/></g><g stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".9"><path d="M90 335c90-70 170-25 255-45"/><path d="M520 350c80-40 145-38 235-12"/></g><g transform="translate(520 318)" stroke="#476f96" stroke-width="4" stroke-linecap="round"><path d="M10 8h70"/><path d="M25 8 5 30M65 8l20 22"/><path d="M31 4h28"/></g></svg>`}
function renderNav(){nav.innerHTML=NAV.map(([id,ic,en,zh])=>`<button data-page="${id}" class="${state.page===id?'active':''}"><span class="nav-ico">${icon(ic)}</span><span><b>${en}</b><small>${zh}</small></span></button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;save();render()})}
function renderPlayers(){players.innerHTML=['Alex','Leo','Rina','Roy'].map(n=>`<button class="player ${state.player===n?'active':''}" data-p="${n}"><span class="avatar">${avatar(n==='Alex'||n==='Leo'?n:'Alex')}</span><span><b>${n}</b><small>Lv. ${DATA[n].level}</small></span></button>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{state.player=b.dataset.p;save();render()})}
function toast(en,zh){const t=document.getElementById('toast');t.innerHTML=en+'<small>'+zh+'</small>';t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1500)}function burst(){for(let i=0;i<16;i++){const e=document.createElement('i');e.className='spark';e.style.left='50%';e.style.top='45%';e.style.background=['#5aa8ff','#9a7ff1','#ffca55','#68d1ae'][i%4];e.style.setProperty('--x',(Math.random()*240-120)+'px');e.style.setProperty('--y',(Math.random()*200-140)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),750)}}function combo(){state.combo=(state.combo||0)+1;const c=document.getElementById('combo');c.textContent='COMBO x'+state.combo+'!';c.classList.add('show');setTimeout(()=>c.classList.remove('show'),800)}
function completeTask(i){const p=P();const key=k(i),done=!!state.done[key],t=p.tasks[i];state.done[key]=!done;p.xp+=done?-t[2]:t[2];p.coins+=done?-t[3]:t[3];if(!done){burst();combo();toast(`+${t[2]} XP · +${t[3]} Coins`,'任务完成！')}save();render()}
function home(){const p=P(),c=completed(),pct=Math.round(p.xp/p.next*100);return `<div class="hero"><div class="world"><div class="scene">${scene()}</div><div class="world-copy"><div class="eyebrow">${state.player.toUpperCase()}’S WORLD</div><h3>${state.player==='Leo'?'Dino Code Island':'A Brighter Adventure'}</h3><p>Explore · Learn · Grow · Be a Better You</p><span class="zh">探索 · 学习 · 成长</span></div><div class="hero-avatar"><span class="avatar">${avatar(state.player==='Leo'?'Leo':'Alex')}</span><div><h4>${state.player}</h4><small>${p.title} · ${p.zh}</small></div></div><div class="float-label lab-label">${icon('science')} Science Lab</div><div class="float-label rowing-label">${icon('rowing')} Rowing Club</div></div><aside class="hudcard"><h3>Level ${p.level}</h3><span class="zh">等级</span><div class="xpbar"><span style="width:${Math.min(100,pct)}%"></span></div><div class="xplabel"><span>${p.xp} XP</span><span>${p.next} XP</span></div><div class="stats"><div class="stat"><strong>${p.coins}</strong><small>Coins · 金币</small></div><div class="stat"><strong>${p.streak}</strong><small>Day Streak · 连续</small></div></div><div class="chest"><div class="chest-top"><div class="gift3d sparkle"><i class="box"></i><i class="lid"></i><i class="rib"></i><i class="bow"></i></div><div><b>${c>=3?'Mystery Box Ready!':'Mystery Box'}</b><span class="zh">完成 3 个任务开启惊喜</span></div></div><div class="mini" style="margin-top:10px"><span style="width:${Math.min(100,c/3*100)}%;background:linear-gradient(90deg,#ffca55,#ff9f72)"></span></div></div></aside></div><div class="section-grid"><section class="card"><div class="card-head"><h3>Today’s Quests <span class="zh">今日任务</span></h3><button class="linkbtn" onclick="go('tasks')">View all</button></div>${p.tasks.slice(0,5).map((t,i)=>`<div class="task"><button class="${state.done[k(i)]?'done':''}" onclick="completeTask(${i})">${state.done[k(i)]?'✓':''}</button><div><b>${t[0]}</b><small>${t[1]}</small></div><span class="reward">+${t[2]} XP · +${t[3]}</span></div>`).join('')}</section><section class="card"><div class="card-head"><h3>World Map <span class="zh">成长地图</span></h3></div><div class="map-mini"><i class="river"></i><i class="route"></i><i class="island i1"></i><i class="island i2"></i><i class="island i3"></i>${p.goals.map((g,i)=>`<button class="map-node m${i+1} ${i===0?'done':i<=Math.max(1,c)?'current':'locked'}" title="${g[0]}">${icon(g[2])}</button>`).join('')}</div></section><section class="card"><div class="card-head"><h3>This Week <span class="zh">本周成长</span></h3></div><div class="week">${[['Quests',Math.min(100,c*20),c],['XP',64,p.xp],['Streak',p.streak*8,p.streak],['Skills',52,6]].map(x=>`<div class="week-row"><b>${x[0]}</b><div class="weekbar"><span style="width:${x[1]}%"></span></div><strong>${x[2]}</strong></div>`).join('')}</div></section></div><div class="tiles">${[['skills','skills','My Skills','技能成长'],['assets','gift','Growth Assets','成长资产'],['shop','shop','Reward Shop','奖励商店'],['family','family','Family','家庭中心']].map(x=>`<button class="tile" onclick="go('${x[0]}')"><span class="big">${icon(x[1])}</span><h4>${x[2]}</h4><small>${x[3]}</small></button>`).join('')}</div>`}
function panelTitle(en,zh){return `<div class="panel-title"><h2>${en}<span class="zh">${zh}</span></h2><button class="backhome" onclick="go('home')">Home</button></div>`}function tasksPage(){return panelTitle('Quest Hall','任务大厅')+`<div class="quest-grid">${P().tasks.map((t,i)=>`<div class="quest-card"><div class="icon modern-icon">${icon(t[4])}</div><h3>${t[0]}</h3><p>${t[1]}</p><button class="action" onclick="completeTask(${i})">${state.done[k(i)]?'Completed ✓':'Complete Quest'}</button></div>`).join('')}</div>`}function goalsPage(){const p=P(),c=completed();return panelTitle('World Map','目标地图')+`<div class="goalmap"><i class="river"></i><i class="route"></i>${p.goals.map((g,i)=>`<button class="goal-node g${i+1} ${i===0?'done':i<=Math.max(1,c)?'current':'locked'}"><span class="modern-icon">${icon(g[2])}</span><b>${g[0]}</b><small>${g[1]}</small></button>`).join('')}</div>`}function skillsPage(){return panelTitle('My Skills','技能成长')+`<div class="skills-grid">${P().skills.map(s=>`<div class="skill-card"><div class="icon modern-icon">${icon(s[3])}</div><h3>${s[0]}</h3><p>${s[1]} · Lv. ${Math.max(1,Math.floor(s[2]/20))}</p><div class="mini"><span style="width:${s[2]}%"></span></div></div>`).join('')}</div>`}function assetsPage(){return panelTitle('Growth Assets','成长资产')+`<div class="card"><div class="card-head"><h3>Collection</h3></div><div class="inventory"><span class="badge owned">Explorer Badge</span><span class="badge owned">Lab Goggles</span><span class="badge">Dino Pack</span><span class="badge">Mini Telescope</span><span class="badge">Rowing Medal</span></div><div class="chest" style="max-width:360px;margin-top:20px"><div class="chest-top"><div class="gift3d sparkle"><i class="box"></i><i class="lid"></i><i class="rib"></i><i class="bow"></i></div><div><b>Modern Mystery Gift</b><span class="zh">奖励礼物盒</span></div></div></div></div>`}function shopPage(){const items=[['Extra Game Time',60,'gift'],['Choose Dessert',40,'star'],['Family Movie Night',80,'family'],['Special Outing',180,'map']];return panelTitle('Reward Shop','奖励商店')+`<div class="shop-grid">${items.map((x,i)=>`<div class="shop-item"><div class="icon modern-icon">${icon(x[2])}</div><h3>${x[0]}</h3><p>${x[1]} coins</p><button class="action gold" onclick="buy(${i},${x[1]},'${x[0]}')">Buy</button></div>`).join('')}</div>`}function buy(i,cost,name){if(P().coins<cost){toast('Not enough coins','金币不够');return}P().coins-=cost;state.owned[state.player+'-'+i]=true;save();burst();toast(name+' unlocked!','奖励已获得');render()}function familyPage(){return panelTitle('Family','家庭中心')+`<div class="family-grid">${['Alex','Leo','Rina','Roy'].map(n=>`<div class="member-card ${state.player===n?'active':''}" onclick="pick('${n}')"><div class="avatar">${avatar(n==='Leo'?'Leo':'Alex')}</div><h3>${n}</h3><span class="zh">${DATA[n].title}</span></div>`).join('')}</div>`}function go(p){state.page=p;save();render()}function pick(n){state.player=n;save();render()}
function render(){renderNav();renderPlayers();greeting.textContent=`Good evening, ${state.player}!`;page.innerHTML=state.page==='home'?home():state.page==='tasks'?tasksPage():state.page==='goals'?goalsPage():state.page==='skills'?skillsPage():state.page==='assets'?assetsPage():state.page==='shop'?shopPage():familyPage()}render();
</script>
</body></html>

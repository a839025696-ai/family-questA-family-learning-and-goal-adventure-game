<style>

,255,.22);background:rgba(13,36,70,.76);color:#d9e9fb;border-radius:15px;padding:7px 10px;display:flex;align-items:center;gap:7px;cursor:pointer}.player.active{border-color:var(--cyan);box-shadow:0 0 18px rgba(79,203,255,.22);background:rgba(23,69,126,.82)}.player .face{font-size:19px}.player b{font-size:11px}.player small{display:block;color:#8ea9c4;font-size:8px}.page{display:none}.page.active{display:block}.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,.76fr);gap:15px;margin-bottom:15px}.world{min-height:365px;border-radius:26px;position:relative;overflow:hidden;border:1px solid rgba(87,190,255,.24);box-shadow:var(--shadow);background:linear-gradient(rgba(5,19,45,.15),rgba(5,19,45,.72)),url('lifeverse-dashboard.png') center/cover no-repeat}.world:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,18,42,.78),transparent 49%,rgba(6,18,42,.2));pointer-events:none}.world-copy{position:absolute;z-index:2;left:26px;top:25px;max-width:430px}.eyebrow{font-size:10px;letter-spacing:1.6px;color:#7ee9ff;font-weight:900}.world-copy h3{font-size:34px;line-height:1.04;margin:8px 0}.world-copy p{margin:0;color:#d0e5fa;font-size:12px}.hero-avatar{position:absolute;z-index:2;left:26px;bottom:24px;display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(8,26,55,.78);backdrop-filter:blur(10px);border:1px solid rgba(103,213,255,.28);border-radius:18px}.portrait{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:35px;background:linear-gradient(135deg,#306bd6,#7b55d8)}.hero-avatar h4{margin:0 0 3px;font-size:20px}.hero-avatar small{color:#a7bdd4;font-size:9px}.hudcard,.card,.quest-card,.shop-item,.skill-card,.member-card{border:1px solid rgba(97,190,255,.2);background:linear-gradient(180deg,rgba(17,47,88,.93),rgba(10,29,57,.94));box-shadow:var(--shadow)}.hudcard{border-radius:24px;padding:18px}.hudcard h3{margin:0 0 2px;font-size:23px}.xpbar,.mini{height:10px;border-radius:99px;background:#263c5d;overflow:hidden}.xpbar span,.mini span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .35s}.xplabel{display:flex;justify-content:space-between;color:#a7bdd4;font-size:9px;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.stat{padding:12px;border:1px solid rgba(109,183,255,.17);border-radius:15px;background:rgba(16,45,81,.75)}.stat strong{font-size:19px}.stat small{display:block;color:#8ea8c1;font-size:8px;margin-top:2px}.chest{margin-top:11px;padding:12px;border-radius:16px;background:linear-gradient(135deg,rgba(154,101,26,.2),rgba(255,196,75,.08));border:1px solid rgba(255,210,90,.27)}.chest-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.chest b{font-size:11px}.chest .zh{font-size:8px}.section-grid{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:14px}.card{border-radius:22px;padding:17px;min-width:0}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.card-head h3{margin:0;font-size:16px}.linkbtn{border:0;background:transparent;color:#6edcff;font-size:10px;font-weight:800;cursor:pointer}.task{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;padding:10px 0;border-top:1px solid rgba(133,179,225,.09)}.task:first-of-type{border-top:0}.task button{width:28px;height:28px;border-radius:8px;border:1px solid #4aa8dc;background:#163c68;color:white;cursor:pointer;transition:.18s}.task button.done{background:var(--green);border-color:var(--green);transform:scale(1.06)}.task b{font-size:11px}.task small{display:block;font-size:8px;color:#88a3bf;margin-top:2px}.reward{font-size:9px;color:var(--gold);font-weight:900}.map-mini,.goalmap{position:relative;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 70% 22%,rgba(117,91,210,.35),transparent 28%),linear-gradient(160deg,#173d72,#0b274b 72%)}.map-mini{height:210px}.goalmap{min-height:500px;border:1px solid rgba(102,196,255,.2)}.river{position:absolute;width:145%;height:70px;left:-20%;top:84px;transform:rotate(-8deg);background:linear-gradient(180deg,rgba(88,218,255,.35),rgba(35,120,196,.28));border-radius:50%}.route{position:absolute;left:13%;right:12%;top:50%;height:4px;background:linear-gradient(90deg,var(--green),var(--cyan),var(--violet));transform:rotate(-8deg)}.map-node,.goal-node{border:2px solid #6fe5ff;background:#113a68;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 16px rgba(77,212,255,.22);transition:.2s}.map-node{position:absolute;width:50px;height:50px;border-radius:50%;font-size:21px}.map-node.done,.goal-node.done{background:#17684d;border-color:#61e7a9}.map-node.current,.goal-node.current{background:#4b3c92;border-color:#c19cff;box-shadow:0 0 28px rgba(175,120,255,.28)}.map-node.locked,.goal-node.locked{filter:grayscale(.8);opacity:.4}.m1{left:9%;top:59%}.m2{left:34%;top:29%}.m3{left:57%;top:58%}.m4{right:9%;top:24%}.week{display:grid;gap:8px}.week-row{display:grid;grid-template-columns:72px 1fr 34px;gap:8px;align-items:center}.week-row b{font-size:9px}.weekbar{height:8px;border-radius:99px;background:#273d59;overflow:hidden}.weekbar span{height:100%;display:block;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--cyan))}.week-row strong{font-size:9px;text-align:right}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.tile{min-height:145px;border:1px solid rgba(105,191,255,.18);border-radius:20px;background:linear-gradient(155deg,rgba(22,55,98,.95),rgba(13,32,64,.95));padding:16px;cursor:pointer;text-align:left;color:white;transition:.18s}.tile:hover{transform:translateY(-2px);border-color:rgba(111,223,255,.5)}.tile .big{font-size:31px}.tile h4{margin:13px 0 3px;font-size:14px}.tile small{font-size:9px;color:#91abc5}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel-title h2{margin:0;font-size:27px}.backhome{border:1px solid rgba(102,196,255,.28);border-radius:12px;background:#143a69;color:#eaf7ff;padding:9px 12px;cursor:pointer}.quest-grid,.shop-grid,.family-grid,.skills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.quest-card,.shop-item,.skill-card,.member-card{border-radius:20px;padding:16px}.quest-card .icon,.shop-item .icon,.skill-card .icon{font-size:30px}.quest-card h3,.shop-item h3,.skill-card h3{margin:10px 0 3px;font-size:15px}.quest-card p,.shop-item p,.skill-card p{font-size:9px;color:#8fa8c2;min-height:26px}.action{border:1px solid rgba(100,214,255,.32);background:linear-gradient(135deg,#276dbe,#594db1);color:white;border-radius:11px;padding:9px 11px;font-weight:800;cursor:pointer}.action.gold{background:rgba(174,120,18,.26);border-color:rgba(255,211,93,.42);color:#ffe088}.action:disabled{opacity:.35;cursor:not-allowed}.goalmap .route{top:52%;left:9%;right:9%;height:5px;transform:none}.goal-node{position:absolute;width:160px;min-height:116px;border-radius:18px;padding:14px;text-align:center}.goal-node .icon{font-size:28px}.goal-node b{display:block;font-size:12px;margin-top:5px}.goal-node small{font-size:8px;color:#90a9c3}.g1{left:5%;top:62%}.g2{left:29%;top:28%}.g3{left:53%;top:58%}.g4{right:5%;top:24%}.skill-card .level{font-size:9px;color:#77defb}.skill-card .mini{margin-top:12px}.member-card{text-align:center;cursor:pointer}.member-card.active{border-color:var(--cyan);box-shadow:0 0 20px rgba(85,220,255,.16)}.member-card .face{font-size:38px}.member-card h3{margin:8px 0 3px}.inventory{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.badge{padding:7px 10px;border-radius:999px;background:#173a68;border:1px solid rgba(112,207,255,.2);font-size:9px}.owned{border-color:rgba(255,215,95,.4);background:rgba(139,93,17,.22)}.combo{position:fixed;left:50%;top:18%;transform:translate(-50%,-20px) scale(.85);opacity:0;z-index:50;font-size:36px;font-weight:1000;color:#fff;text-shadow:0 0 20px var(--cyan),0 0 36px var(--violet);transition:.22s;pointer-events:none}.combo.show{opacity:1;transform:translate(-50%,0) scale(1)}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#112c4e;border:1px solid rgba(100,218,255,.38);padding:11px 15px;border-radius:14px;box-shadow:var(--shadow);font-size:12px;font-weight:800;transition:.2s;z-index:60}.toast.show{opacity:1;transform:translate(-50%,0)}.toast small{display:block;color:#91a9c2;font-size:8px;margin-top:2px;text-align:center;font-weight:500}.spark{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:70;animation:burst .72s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}@media(max-width:1100px){.app{grid-template-columns:86px 1fr}.brand h1,.brand small,.nav b,.nav small{display:none}.brand{justify-content:center}.nav button{grid-template-columns:1fr;text-align:center}.hero{grid-template-columns:1fr}.section-grid{grid-template-columns:1fr 1fr}.section-grid .card:first-child{grid-column:1/-1}.tiles{grid-template-columns:repeat(2,1fr)}.quest-grid,.shop-grid,.skills-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{display:block}.sidebar{height:auto;position:static;padding:10px;border-right:0;border-bottom:1px solid rgba(112,177,238,.18)}.brand{display:none}.nav{grid-template-columns:repeat(4,1fr);gap:5px}.nav button{padding:8px 3px}.nav button:nth-child(n+5){display:none}.main{padding:14px}.topbar{align-items:flex-start;flex-direction:column}.players{justify-content:flex-start}.hero,.section-grid{grid-template-columns:1fr}.section-grid .card:first-child{grid-column:auto}.world{min-height:310px}.world-copy h3{font-size:27px}.tiles,.quest-grid,.shop-grid,.skills-grid,.family-grid{grid-template-columns:1fr 1fr}.goalmap{min-height:640px}.goal-node{width:132px}.g1{left:3%;top:70%}.g2{left:46%;top:48%}.g3{left:5%;top:23%}.g4{right:4%;top:7%}}

<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="brandmark">∞</div><div><h1>LifeVerse</h1><small>Family Quest</small></div></div><nav class="nav" id="nav"></nav></aside>
<main class="main"><div class="topbar"><div class="greeting"><h2 id="greeting">Good evening, Alex!</h2><small>今天也向更好的自己前进一步。</small></div><div class="players" id="players"></div></div><section class="page active" id="page"></section></main>
</div>
<div class="combo" id="combo">COMBO x2!</div><div class="toast" id="toast"></div>
<script>
const DATA={Alex:{face:'🧑‍🚀',title:'Science Explorer',zh:'科学探索者',level:4,xp:320,next:500,coins:145,streak:6,skillPts:2,tasks:[['Reading · 20 min','阅读 · 20分钟',20,8,'📘'],['Math Focus · 25 min','数学专注 · 25分钟',25,10,'🧮'],['Science Discovery','科学探索',30,12,'🔬'],['Organize Backpack','整理书包',15,6,'🎒']],goals:[['Habit Base','习惯基础','🌱'],['Science Lv.1','科学探索','🔬'],['History & Finance','历史与金融','🏛️'],['Future Explorer','未来职业','🚀']],skills:[['Science','科学','🔬'],['History','历史','🏛️'],['Finance','金融','💰'],['Rowing','赛艇','🚣'],['Tuba','大号','🎺'],['English','英语','📘']]},Leo:{face:'🦖',title:'Dino Code Adventurer',zh:'恐龙代码勇士',level:3,xp:210,next:400,coins:118,streak:4,skillPts:1,tasks:[['Reading · 15 min','阅读 · 15分钟',18,7,'📗'],['Math Focus · 20 min','数学专注 · 20分钟',22,9,'🧮'],['Animal Discovery','动物知识探索',30,12,'🦕'],['Move · 30 min','运动 · 30分钟',18,7,'⚽']],goals:[['Habit Base','习惯基础','🌱'],['Animals & Fossils','动物与古生物','🦕'],['Coding Adventure','编程冒险','💻'],['AI & Cyber World','AI与网络世界','🤖']],skills:[['Animals','动物','🦕'],['Paleontology','古生物','🦴'],['Coding','编程','💻'],['Soccer','足球','⚽'],['English','英语','📘'],['Creativity','创造力','🎨']]},Rina:{face:'👩',title:'Creator & Planner',zh:'创建者 · 规划者',level:8,xp:120,next:300,coins:1250,streak:8,skillPts:3,tasks:[['Plan Family Quests','规划家庭任务',18,8,'📝'],['Review Progress','查看成长进度',18,8,'📊']],goals:[['Family System','家庭系统','🏠'],['Quest Design','任务设计','🧭'],['Reward Economy','奖励机制','🪙'],['Family Legacy','家庭成长','✨']],skills:[['Planning','规划','🗺️'],['Teaching','教育','📚'],['Family','家庭','❤️']]},Roy:{face:'👨',title:'Supporter & Adventurer',zh:'支持者 · 冒险者',level:5,xp:90,next:220,coins:380,streak:3,skillPts:1,tasks:[['Family Support','家庭支持',20,8,'🤝'],['Exercise','运动',18,7,'🏃']],goals:[['Support Base','支持基础','🤝'],['Adventure','家庭冒险','🧭'],['Family Team','家庭团队','🏠'],['Legacy','家庭传承','⭐']],skills:[['Support','支持','🤝'],['Fitness','运动','🏃'],['Adventure','探索','🧭']]}};
const navItems=[['home','🏠','Home','首页'],['tasks','⚔️','Quest Hall','任务大厅'],['goals','🗺️','Goal Map','目标地图'],['skills','📊','Skills','技能'],['assets','🎁','Growth Assets','成长资产'],['shop','🛍️','Reward Shop','奖励商店'],['family','👨‍👩‍👦','Family Center','家庭中心']];
let state=JSON.parse(localStorage.getItem('lifeverseGameV4')||'null')||{player:'Alex',done:{},owned:{},skillLv:{},combo:0,chests:{},lastQuest:0};
for(const n in DATA){state.chests[n]=state.chests[n]||0}function save(){localStorage.setItem('lifeverseGameV4',JSON.stringify(state))}function P(){return DATA[state.player]}function key(i){return state.player+'-'+i}function completedCount(){return P().tasks.filter((_,i)=>state.done[key(i)]).length}function nodeStatus(i){const c=completedCount();if(i===0)return'done';if(i===1)return c>=1?'current':'locked';if(i===2)return c>=2?'current':'locked';if(i===3)return c>=4?'current':'locked';return'locked'}
function toast(en,zh){const t=document.getElementById('toast');t.innerHTML=en+'<small>'+zh+'</small>';t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1800)}function burst(){for(let i=0;i<18;i++){const s=document.createElement('i');s.className='spark';s.style.left='50%';s.style.top='45%';s.style.background=i%3===0?'#ffd05f':i%3===1?'#63e4ff':'#aa7cff';s.style.setProperty('--x',(Math.random()*260-130)+'px');s.style.setProperty('--y',(Math.random()*220-150)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),800)}}function combo(){state.combo=Math.min(9,(state.combo||0)+1);const el=document.getElementById('combo');el.textContent='COMBO x'+state.combo+'!';el.classList.add('show');clearTimeout(window.__combo);window.__combo=setTimeout(()=>el.classList.remove('show'),900)}
function renderNav(){document.getElementById('nav').innerHTML=navItems.map(([id,ic,en,zh])=>`<button data-page="${id}" class="${state.page===id||(!state.page&&id==='home')?'active':''}"><span class="ico">${ic}</span><span><b>${en}</b><small>${zh}</small></span></button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;save();render()})}
function renderPlayers(){document.getElementById('players').innerHTML=Object.keys(DATA).map(n=>`<button class="player ${n===state.player?'active':''}" data-player="${n}"><span class="face">${DATA[n].face}</span><span><b>${n}</b><small>Lv.${DATA[n].level}</small></span></button>`).join('');document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>{state.player=b.dataset.player;state.combo=0;save();render();toast('Now playing: '+state.player,'已切换角色')})}
function complete(i){const p=P(),t=p.tasks[i],k=key(i);if(state.done[k]){state.done[k]=false;state.combo=0;save();render();return}state.done[k]=true;p.xp+=t[2];p.coins+=t[3];p.skillPts+=1;state.chests[state.player]=(state.chests[state.player]||0)+1;combo();burst();if(p.xp>=p.next){p.xp-=p.next;p.level++;p.next=Math.round(p.next*1.25);toast('LEVEL UP! +1 Skill Point','升级！获得技能点')}else toast('Quest complete! +'+t[2]+' XP · +'+t[3]+' Coins','任务完成');if(state.chests[state.player]>=4){state.chests[state.player]=0;p.coins+=25;toast('Treasure chest opened! +25 Coins','宝箱开启！')}save();render()}
function home(){const p=P(),pct=Math.min(100,Math.round(p.xp/p.next*100)),c=completedCount(),ch=state.chests[state.player]||0;return `<div class="hero"><div class="world"><div class="world-copy"><div class="eyebrow">YOUR ADVENTURE TODAY</div><h3>Level up your real life.</h3><p>Small steps become skills, rewards and new worlds.</p><span class="zh">把每天的小行动，变成真正的人生成长。</span></div><div class="hero-avatar"><div class="portrait">${p.face}</div><div><h4>${state.player}</h4><small>${p.title}</small><span class="zh">${p.zh}</span></div></div></div><aside class="hudcard"><h3>Lv.${p.level} · ${state.player}</h3><div class="zhline">当前角色成长状态</div><div class="xpbar"><span style="width:${pct}%"></span></div><div class="xplabel"><span>${p.xp} XP</span><span>${p.next} XP</span></div><div class="stats"><div class="stat"><strong>🪙 ${p.coins}</strong><small>COINS · 金币</small></div><div class="stat"><strong>🔥 ${p.streak}</strong><small>STREAK · 连续天数</small></div><div class="stat"><strong>✨ ${p.skillPts}</strong><small>SKILL POINTS · 技能点</small></div><div class="stat"><strong>✅ ${c}/${p.tasks.length}</strong><small>TODAY · 今日完成</small></div></div><div class="chest"><div class="chest-top"><b>🎁 Treasure Meter <span class="zh">宝箱进度</span></b><b>${ch}/4</b></div><div class="mini"><span style="width:${ch/4*100}%"></span></div></div></aside></div><div class="section-grid"><section class="card"><div class="card-head"><div><h3>Today's Quests</h3><small>今日任务</small></div><button class="linkbtn" data-go="tasks">See All →</button></div>${p.tasks.map((t,i)=>`<div class="task"><button class="${state.done[key(i)]?'done':''}" data-task="${i}">${state.done[key(i)]?'✓':''}</button><div><b>${t[4]} ${t[0]}</b><small>${t[1]}</small></div><span class="reward">+${t[2]} XP · +${t[3]}🪙</span></div>`).join('')}</section><section class="card"><div class="card-head"><div><h3>Goal Map</h3><small>目标地图</small></div><button class="linkbtn" data-go="goals">Open →</button></div><div class="map-mini"><div class="river"></div><div class="route"></div>${p.goals.map((g,i)=>`<button class="map-node m${i+1} ${nodeStatus(i)}" data-node="${i}" title="${g[0]}">${g[2]}</button>`).join('')}</div></section><section class="card"><div class="card-head"><div><h3>Weekly Progress</h3><small>本周进度</small></div></div><div class="week">${[['Learning',70],['Health',55],['Service',40],['Family',80]].map(([n,v])=>`<div class="week-row"><b>${n}</b><div class="weekbar"><span style="width:${v}%"></span></div><strong>${v}%</strong></div>`).join('')}</div></section></div><div class="tiles">${[['skills','📊','Skills','技能升级'],['assets','🎁','Growth Assets','成长资产'],['shop','🛍️','Reward Shop','奖励商店'],['family','👨‍👩‍👦','Family Center','家庭中心']].map(x=>`<button class="tile" data-go="${x[0]}"><span class="big">${x[1]}</span><h4>${x[2]}</h4><small>${x[3]}</small></button>`).join('')}</div>`}
function title(en,zh){return `<div class="panel-title"><div><h2>${en}</h2><small>${zh}</small></div><button class="backhome" data-go="home">← Home</button></div>`}
function tasks(){const p=P();return title('Quest Hall','任务大厅')+`<div class="quest-grid">${p.tasks.map((t,i)=>`<article class="quest-card"><div class="icon">${t[4]}</div><h3>${t[0]}</h3><span class="zh">${t[1]}</span><p>Complete this quest to earn XP, Coins and a Skill Point.</p><button class="action ${state.done[key(i)]?'gold':''}" data-task="${i}">${state.done[key(i)]?'Completed ✓':'Complete Quest'}</button></article>`).join('')}</div>`}
function goals(){const p=P();return title('Goal Map','目标地图')+`<div class="goalmap"><div class="route"></div>${p.goals.map((g,i)=>`<button class="goal-node g${i+1} ${nodeStatus(i)}" data-node="${i}"><span class="icon">${g[2]}</span><b>${g[0]}</b><small>${g[1]}</small><span class="zh">${nodeStatus(i)==='locked'?'Complete more quests to unlock':'Unlocked'}</span></button>`).join('')}</div>`}
function skills(){const p=P();return title('Skills','技能')+`<p class="eyebrow">AVAILABLE SKILL POINTS: ${p.skillPts}</p><div class="skills-grid">${p.skills.map((s,i)=>{const k=state.player+'-s'+i,l=state.skillLv[k]||1,prog=Math.min(100,l*18);return `<article class="skill-card"><div class="icon">${s[2]}</div><div class="level">LEVEL ${l}</div><h3>${s[0]}</h3><span class="zh">${s[1]}</span><p>Invest Skill Points to make this ability stronger.</p><div class="mini"><span style="width:${prog}%"></span></div><br><button class="action" data-skill="${i}" ${p.skillPts<=0?'disabled':''}>Upgrade · 1 ✨</button></article>`}).join('')}</div>`}
function assets(){const p=P();const owned=Object.keys(state.owned).filter(k=>k.startsWith(state.player+'-')&&state.owned[k]);return title('Growth Assets','成长资产')+`<div class="hero"><div class="hudcard"><h3>Your Current Assets</h3><span class="zh">当前成长资产</span><div class="stats"><div class="stat"><strong>🪙 ${p.coins}</strong><small>COINS</small></div><div class="stat"><strong>✨ ${p.skillPts}</strong><small>SKILL POINTS</small></div><div class="stat"><strong>🎁 ${state.chests[state.player]||0}/4</strong><small>CHEST METER</small></div><div class="stat"><strong>🔥 ${p.streak}</strong><small>STREAK</small></div></div></div><div class="card"><div class="card-head"><div><h3>Inventory</h3><small>已拥有奖励</small></div></div><div class="inventory">${owned.length?owned.map(k=>`<span class="badge owned">🏆 ${k.split('-').slice(1).join('-')}</span>`).join(''):'<span class="badge">No rewards yet · 还没有奖励</span>'}</div></div></div>`}
const shopItems=[['Game Time +30m','额外游戏时间',60,'🎮'],['Dessert Choice','甜点选择权',45,'🍰'],['Family Movie Pick','家庭电影选择权',80,'🎬'],['Weekend Adventure','周末特别活动',140,'🧭'],['Special Badge','特殊徽章',100,'🏅'],['Mystery Reward','神秘奖励',120,'🎁']];function shop(){const p=P();return title('Reward Shop','奖励商店')+`<div class="shop-grid">${shopItems.map((it,i)=>{const k=state.player+'-'+it[0],own=state.owned[k];return `<article class="shop-item"><div class="icon">${it[3]}</div><h3>${it[0]}</h3><span class="zh">${it[1]}</span><p>${own?'Already unlocked and saved in your inventory.':'Use Coins earned from real-life quests.'}</p><button class="action gold" data-buy="${i}" ${own||p.coins<it[2]?'disabled':''}>${own?'Owned ✓':it[2]+' Coins'}</button></article>`}).join('')}</div>`}
function family(){return title('Family Center','家庭中心')+`<div class="family-grid">${Object.keys(DATA).map(n=>`<button class="member-card ${n===state.player?'active':''}" data-player="${n}"><div class="face">${DATA[n].face}</div><h3>${n}</h3><small>${DATA[n].title}</small><span class="zh">${DATA[n].zh}</span></button>`).join('')}</div>`}
function pageHTML(){switch(state.page){case'tasks':return tasks();case'goals':return goals();case'skills':return skills();case'assets':return assets();case'shop':return shop();case'family':return family();default:return home()}}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.page=b.dataset.go;save();render()});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>complete(+b.dataset.task));document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{const i=+b.dataset.node,s=nodeStatus(i);if(s==='locked')toast('Locked area','完成更多任务后解锁');else toast(P().goals[i][0],P().goals[i][1])});document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{const i=+b.dataset.skill,p=P();if(p.skillPts<=0)return;const k=state.player+'-s'+i;state.skillLv[k]=(state.skillLv[k]||1)+1;p.skillPts--;save();burst();toast('Skill upgraded!','技能升级');render()});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const i=+b.dataset.buy,it=shopItems[i],p=P(),k=state.player+'-'+it[0];if(p.coins>=it[2]&&!state.owned[k]){p.coins-=it[2];state.owned[k]=true;save();burst();toast('Reward unlocked!','奖励已解锁');render()}});document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>{state.player=b.dataset.player;state.combo=0;save();render();toast('Now playing: '+state.player,'已切换角色')})}
function render(){state.page=state.page||'home';document.getElementById('greeting').textContent='Good evening, '+state.player+'!';renderNav();renderPlayers();document.getElementById('page').innerHTML=pageHTML();bind()}render();
</script>
</body>
</html>

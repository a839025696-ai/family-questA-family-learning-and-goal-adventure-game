<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#03112f" />
  <title>LifeVerse — Level Up Your Real Life</title>
  <style>
    :root{--cyan:#59e7ff;--blue:#1d7dff;--violet:#8b5cff;--panel:rgba(4,18,58,.94);--line:rgba(87,220,255,.48);--muted:#9fb8e7;--gold:#ffd45b}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020b20;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{overflow:hidden}
    button{font:inherit}.app{position:fixed;inset:0;background:radial-gradient(circle at 70% 20%,#153b8d 0,#071b49 28%,#020b20 68%);display:flex;align-items:center;justify-content:center}
    .stage{position:relative;width:min(100vw,calc(100vh * 1.5));height:min(100vh,calc(100vw / 1.5));aspect-ratio:3/2;overflow:hidden;background:#06163c;box-shadow:0 0 80px rgba(0,160,255,.24)}
    .concept{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:8vw;text-align:center;background:radial-gradient(circle at 50% 25%,rgba(78,94,255,.7),transparent 32%),linear-gradient(150deg,#03102c,#0a2c6f 55%,#120a41)}.fallback h1{font-size:clamp(36px,7vw,100px);margin:0 0 12px;text-shadow:0 0 24px #00cfff}.fallback p{font-size:clamp(16px,2vw,28px);opacity:.85}.concept.loaded+.fallback{display:none}
    .hotspot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:20px;outline:none}.hotspot:focus-visible,.hotspot:hover{box-shadow:inset 0 0 0 2px rgba(75,220,255,.8),0 0 24px rgba(0,190,255,.35);background:rgba(0,180,255,.05)}
    .home{left:1%;top:10%;width:12%;height:6%}.mylife{left:1%;top:17%;width:12%;height:5%}.tasks{left:1%;top:23%;width:12%;height:5%}.goals{left:1%;top:29%;width:12%;height:5%}.skills{left:1%;top:35%;width:12%;height:5%}.assets{left:1%;top:41%;width:12%;height:5%}.shop{left:1%;top:47%;width:12%;height:5%}.family{left:1%;top:53%;width:12%;height:5%}.rina{left:35%;top:1%;width:8%;height:7%}.roy{left:44%;top:1%;width:8%;height:7%}.alex{left:53%;top:1%;width:8%;height:7%}.leo{left:62%;top:1%;width:8%;height:7%}.start{left:55%;top:54%;width:12%;height:10%}.goalcard{left:14.5%;top:72%;width:18%;height:22%}.assetcard{left:33%;top:72%;width:22%;height:22%}.shopcard{left:56%;top:72%;width:19%;height:22%}.familycard{left:76%;top:72%;width:22%;height:22%}
    .hud{position:absolute;right:1.4%;top:1.5%;z-index:4;display:flex;gap:8px;pointer-events:none}.hud-chip{min-width:72px;padding:7px 10px;border:1px solid rgba(89,231,255,.35);border-radius:12px;background:rgba(1,11,38,.72);backdrop-filter:blur(8px);font-weight:800;font-size:12px;box-shadow:0 0 18px rgba(0,170,255,.16)}.hud-chip small{display:block;font-size:8px;color:#8faee1;font-weight:500;margin-top:1px}.hud-chip strong{color:#fff}.hud-chip.coin strong{color:var(--gold)}
    .toast{position:absolute;left:50%;bottom:4%;z-index:9;transform:translate(-50%,30px);padding:12px 20px;border:1px solid rgba(71,222,255,.75);border-radius:14px;background:rgba(3,16,48,.92);backdrop-filter:blur(12px);box-shadow:0 0 26px rgba(0,195,255,.35);font-weight:800;opacity:0;pointer-events:none;transition:.22s;text-align:center}.toast small{display:block;font-size:10px;font-weight:500;color:#a8bee9;margin-top:2px}.toast.show{opacity:1;transform:translate(-50%,0)}
    .shade{position:absolute;inset:0;z-index:10;background:rgba(1,5,20,.62);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:.2s}.shade.show{opacity:1;pointer-events:auto}
    .panel{position:absolute;z-index:11;right:2.2%;top:8%;width:min(520px,62%);max-height:84%;overflow:auto;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(8,34,86,.97),rgba(3,13,44,.97));box-shadow:0 0 42px rgba(36,145,255,.35),inset 0 0 35px rgba(64,170,255,.06);padding:22px;transform:translateX(115%);transition:.28s ease}.panel.show{transform:translateX(0)}
    .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.panel-title{margin:0;font-size:26px;line-height:1.05;letter-spacing:.2px}.zh{display:block;font-size:11px;color:#8faee1;font-weight:500;margin-top:5px;letter-spacing:.4px}.close{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);color:#fff;background:rgba(11,50,112,.8);cursor:pointer;font-size:22px}.subhead{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:#73dfff;margin:18px 0 9px;font-weight:800}.profile-card{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;border:1px solid rgba(102,204,255,.25);background:rgba(17,50,104,.62)}.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#6447ff,#12cfff);box-shadow:0 0 20px rgba(77,184,255,.35)}.profile-card h3{margin:0 0 3px;font-size:20px}.meta{color:#a9c0e8;font-size:12px}.bar{height:9px;border-radius:999px;background:rgba(126,160,223,.22);overflow:hidden;margin-top:8px}.bar>span{display:block;height:100%;background:linear-gradient(90deg,#43e8ff,#7b5cff);border-radius:inherit}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px;border-radius:15px;background:rgba(14,45,100,.7);border:1px solid rgba(94,190,255,.2)}.stat b{font-size:18px}.stat small{display:block;font-size:9px;color:#8faee1;margin-top:2px}
    .task{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:12px 10px;border-bottom:1px solid rgba(116,176,255,.14)}.check{width:24px;height:24px;border-radius:7px;border:1px solid #62dfff;background:rgba(0,117,255,.16);color:#fff;cursor:pointer}.check.done{background:#21d9b5;border-color:#21d9b5}.task-title{font-weight:750}.task-title .zh{font-size:9px;margin-top:2px}.reward{font-size:11px;color:#ffd45b;font-weight:800}.task.done .task-title{text-decoration:line-through;opacity:.62}
    .goal{position:relative;padding:14px 14px 14px 42px;margin:9px 0;border-radius:16px;border:1px solid rgba(96,181,255,.18);background:rgba(12,39,88,.62)}.goal:before{content:"";position:absolute;left:17px;top:18px;width:10px;height:10px;border-radius:50%;background:#465984;box-shadow:0 0 0 4px rgba(80,130,210,.12)}.goal.current:before{background:#4be8ff;box-shadow:0 0 16px #36dfff}.goal.done:before{background:#34dfaa}.goal b{display:block}.goal small{color:#98add4;font-size:10px}
    .shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{padding:13px;border-radius:16px;background:rgba(16,45,99,.68);border:1px solid rgba(116,195,255,.2)}.item-icon{font-size:26px}.item h4{margin:7px 0 2px}.item p{font-size:10px;color:#9eb3da;margin:0 0 10px}.buy{width:100%;border:1px solid rgba(255,215,91,.4);background:rgba(160,114,0,.22);color:#ffe07c;border-radius:10px;padding:8px;cursor:pointer;font-weight:800}.buy:disabled{opacity:.35;cursor:not-allowed}
    .family-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid rgba(101,195,255,.18);border-radius:16px;margin:9px 0;background:rgba(13,42,91,.6)}.family-row .avatar{width:42px;height:42px;font-size:22px}.family-row b{display:block}.family-row small{font-size:10px;color:#98add4}.ghost{border:1px solid rgba(92,216,255,.35);background:rgba(0,119,255,.14);color:#dffbff;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:800}.rotate{display:none;position:fixed;inset:0;z-index:30;background:#020b20;color:white;align-items:center;justify-content:center;text-align:center;padding:32px}.rotate strong{display:block;font-size:24px;margin-bottom:10px}.rotate span{display:block;font-size:11px;color:#8faee1;margin-top:4px}
    @media (orientation:portrait) and (max-width:700px){.rotate{display:flex}.stage{opacity:.12}}
    @media (max-width:900px){.panel{width:70%;padding:16px}.panel-title{font-size:21px}.hud{display:none}}
  </style>
</head>
<body>
<div class="app"><div class="stage" id="stage">
  <img class="concept" id="concept" src="lifeverse-dashboard.png" alt="LifeVerse game home" onload="this.classList.add('loaded')" />
  <div class="fallback"><div><h1>∞ LifeVerse</h1><p>A Better Me. A Brighter Tomorrow.</p></div></div>
  <div class="hud"><div class="hud-chip"><strong id="hudName">Alex</strong><small>PLAYER · 玩家</small></div><div class="hud-chip"><strong id="hudLevel">Lv. 4</strong><small>LEVEL · 等级</small></div><div class="hud-chip coin"><strong id="hudCoins">145</strong><small>COINS · 金币</small></div></div>
  <button class="hotspot home" data-action="home" aria-label="Home"></button><button class="hotspot mylife" data-action="profile" aria-label="My Life"></button><button class="hotspot tasks" data-action="tasks" aria-label="Tasks"></button><button class="hotspot goals" data-action="goals" aria-label="Goals"></button><button class="hotspot skills" data-action="skills" aria-label="Skills"></button><button class="hotspot assets" data-action="assets" aria-label="Growth Assets"></button><button class="hotspot shop" data-action="shop" aria-label="Reward Shop"></button><button class="hotspot family" data-action="family" aria-label="Family"></button>
  <button class="hotspot rina" data-player="Rina" aria-label="Rina"></button><button class="hotspot roy" data-player="Roy" aria-label="Roy"></button><button class="hotspot alex" data-player="Alex" aria-label="Alex"></button><button class="hotspot leo" data-player="Leo" aria-label="Leo"></button>
  <button class="hotspot start" data-action="tasks" aria-label="Start Quest"></button><button class="hotspot goalcard" data-action="goals" aria-label="My Goals"></button><button class="hotspot assetcard" data-action="assets" aria-label="Growth Assets"></button><button class="hotspot shopcard" data-action="shop" aria-label="Reward Shop"></button><button class="hotspot familycard" data-action="family" aria-label="Family"></button>
  <div class="toast" id="toast"></div><div class="shade" id="shade"></div><section class="panel" id="panel" aria-live="polite"></section>
</div></div>
<div class="rotate"><div><strong>Turn your phone sideways</strong><span>请横屏使用，才能看到完整游戏界面。</span></div></div>
<script>
const defaults={
 Alex:{avatar:'🧑‍🚀',title:'Science Explorer',zhTitle:'科学探索者',level:4,xp:320,next:500,coins:145,streak:6,tasks:[['Reading · 20 min','阅读 · 20分钟',10,5],['Math Focus · 25 min','数学专注 · 25分钟',15,6],['Science Discovery','科学探索',15,7],['Organize Backpack','整理书包',8,4]],goals:[['Build a steady study habit','建立稳定学习习惯','done'],['Science Exploration · Lv.1','科学探索 · 第1阶段','current'],['History & Finance','历史与金融','locked'],['Future Career Explorer','未来职业探索','locked']]},
 Leo:{avatar:'🦖',title:'Dino Code Adventurer',zhTitle:'恐龙代码勇士',level:3,xp:210,next:400,coins:118,streak:4,tasks:[['Reading · 15 min','阅读 · 15分钟',10,5],['Math Focus · 20 min','数学专注 · 20分钟',12,5],['Animal Discovery','动物知识探索',15,7],['Move · 30 min','运动 · 30分钟',10,5]],goals:[['Build a steady study habit','建立稳定学习习惯','done'],['Animals & Paleontology · Lv.1','动物与古生物 · 第1阶段','current'],['Coding Adventure','编程冒险','locked'],['AI & Cyber World','AI与网络世界','locked']]},
 Rina:{avatar:'👩',title:'Creator & Planner',zhTitle:'创建者 · 规划者',level:1,xp:0,next:100,coins:1250,streak:0,tasks:[['Plan family quests','规划家庭任务',10,5],['Review weekly progress','查看本周进度',10,5]],goals:[['Build a better family system','建立更好的家庭成长系统','current']]},
 Roy:{avatar:'👨',title:'Supporter & Adventurer',zhTitle:'支持者 · 冒险者',level:1,xp:0,next:100,coins:0,streak:0,tasks:[['Focused Work','专注工作',10,5],['Exercise','运动',10,5],['Reading','阅读',10,5]],goals:[['Support family adventures','支持家庭冒险','current']]}
};
let state=JSON.parse(localStorage.getItem('lifeverseInteractive')||'null')||{active:'Alex',players:{}};for(const [k,v] of Object.entries(defaults)){state.players[k]={...v,...(state.players[k]||{})};if(!state.players[k].completed)state.players[k].completed=[]}
const save=()=>localStorage.setItem('lifeverseInteractive',JSON.stringify(state));
const p=()=>state.players[state.active];const panel=document.getElementById('panel'),shade=document.getElementById('shade'),toast=document.getElementById('toast');
function hud(){document.getElementById('hudName').textContent=state.active;document.getElementById('hudLevel').textContent='Lv. '+p().level;document.getElementById('hudCoins').textContent=p().coins}
function notify(en,zh=''){toast.innerHTML=en+(zh?`<small>${zh}</small>`:'');toast.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>toast.classList.remove('show'),1500)}
function closePanel(){panel.classList.remove('show');shade.classList.remove('show')}
function openPanel(type){panel.innerHTML=render(type);panel.classList.add('show');shade.classList.add('show');bindPanel(type)}
function head(en,zh){return `<div class="panel-head"><div><h2 class="panel-title">${en}<span class="zh">${zh}</span></h2></div><button class="close" data-close>×</button></div>`}
function profileBlock(){const x=p(),pct=Math.min(100,Math.round(x.xp/x.next*100));return `<div class="profile-card"><div class="avatar">${x.avatar}</div><div style="flex:1"><h3>${state.active}</h3><div class="meta">${x.title}<span class="zh">${x.zhTitle}</span></div><div class="bar"><span style="width:${pct}%"></span></div><div class="meta" style="margin-top:5px">Lv. ${x.level} · ${x.xp}/${x.next} XP</div></div></div><div class="grid2" style="margin-top:10px"><div class="stat"><b>🪙 ${x.coins}</b><small>COINS · 金币</small></div><div class="stat"><b>🔥 ${x.streak}</b><small>DAY STREAK · 连续天数</small></div></div>`}
function render(type){const x=p();if(type==='profile')return head('My Life','我的人生')+profileBlock()+`<div class="subhead">Current identity · 当前身份</div><div class="goal current"><b>${x.title}</b><small>${x.zhTitle}</small></div>`;
if(type==='tasks')return head("Today's Quests",'今日任务')+profileBlock()+`<div class="subhead">Quest list · 任务列表</div>${x.tasks.map((t,i)=>`<div class="task ${x.completed.includes(i)?'done':''}"><button class="check ${x.completed.includes(i)?'done':''}" data-task="${i}">${x.completed.includes(i)?'✓':''}</button><div class="task-title">${t[0]}<span class="zh">${t[1]}</span></div><div class="reward">+${t[2]} XP · +${t[3]} 🪙</div></div>`).join('')}`;
if(type==='goals')return head('My Goals','我的目标')+profileBlock()+`<div class="subhead">Adventure path · 成长路线</div>${x.goals.map(g=>`<div class="goal ${g[2]}"><b>${g[0]}</b><small>${g[1]}</small></div>`).join('')}`;
if(type==='shop')return head('Reward Shop','奖励商店')+profileBlock()+`<div class="subhead">Spend coins · 使用金币</div><div class="shop-grid">${[['🎮','30 min Game Time','30分钟游戏时间',50],['🍨','Favorite Treat','喜欢的甜点',35],['🎬','Family Movie Pick','选择家庭电影',60],['🎁','Mystery Reward','神秘奖励',100]].map((it,i)=>`<div class="item"><div class="item-icon">${it[0]}</div><h4>${it[1]}</h4><p>${it[2]}</p><button class="buy" data-buy="${i}" data-cost="${it[3]}" ${x.coins<it[3]?'disabled':''}>${it[3]} COINS</button></div>`).join('')}</div>`;
if(type==='family')return head('Family','家庭')+`<div class="subhead">Different paths. One family. · 不同道路，同一个家</div>${Object.entries(state.players).map(([n,v])=>`<div class="family-row"><div class="avatar">${v.avatar}</div><div style="flex:1"><b>${n}</b><small>${v.title}<span class="zh">${v.zhTitle}</span></small></div><button class="ghost" data-switch="${n}">Open</button></div>`).join('')}`;
if(type==='assets')return head('Growth Assets','成长资产')+profileBlock()+`<div class="subhead">Your collection · 你的成长资产</div><div class="grid2"><div class="stat"><b>⭐ ${Math.floor(x.xp/20)}</b><small>ACHIEVEMENT STARS · 成就星</small></div><div class="stat"><b>📚 ${x.completed.length}</b><small>QUESTS DONE · 已完成任务</small></div><div class="stat"><b>🔥 ${x.streak}</b><small>STREAK · 连续打卡</small></div><div class="stat"><b>🪙 ${x.coins}</b><small>COINS · 金币</small></div></div>`;
if(type==='skills')return head('Skills','技能')+`<div class="subhead">Skill tree · 技能树</div>${['Learning Power','Science & Discovery','Life Skills','Fitness','Money Sense'].map((s,i)=>`<div class="goal ${i<2?'current':''}"><b>${s}</b><small>${['学习力','科学探索','生活技能','体能','金钱意识'][i]}</small></div>`).join('')}`;
return head('LifeVerse','人生冒险')+profileBlock()+`<div class="subhead">Choose your next adventure · 选择下一段冒险</div><button class="ghost" data-go="tasks">Start Quest</button>`}
function bindPanel(type){panel.querySelector('[data-close]')?.addEventListener('click',closePanel);panel.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const i=+b.dataset.task,x=p(),t=x.tasks[i];if(x.completed.includes(i)){x.completed=x.completed.filter(n=>n!==i);x.xp=Math.max(0,x.xp-t[2]);x.coins=Math.max(0,x.coins-t[3]);notify('Quest reopened','任务已重新打开')}else{x.completed.push(i);x.xp+=t[2];x.coins+=t[3];while(x.xp>=x.next){x.xp-=x.next;x.level++;x.next=Math.round(x.next*1.2);notify('LEVEL UP!','升级啦！')}notify('Quest complete! +'+t[2]+' XP','任务完成！')}save();hud();openPanel('tasks')});panel.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const cost=+b.dataset.cost;if(p().coins>=cost){p().coins-=cost;save();hud();notify('Reward unlocked!','奖励已解锁');openPanel('shop')}});panel.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{state.active=b.dataset.switch;save();hud();notify('Playing as '+state.active,'已切换角色');openPanel('family')});panel.querySelector('[data-go]')?.addEventListener('click',()=>openPanel('tasks'))}
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;if(a==='home'){closePanel();notify('Welcome home','欢迎回家')}else openPanel(a)}));document.querySelectorAll('[data-player]').forEach(b=>b.addEventListener('click',()=>{state.active=b.dataset.player;save();hud();notify('Playing as '+state.active,'已切换角色');openPanel('profile')}));shade.addEventListener('click',closePanel);document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});hud();save();
</script>
</body></html>

name: Deploy LifeVerse to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          python - <<'PY'
          from pathlib import Path
          import re

          def inject_script(path, script_name):
              page = Path(path)
              html = page.read_text(encoding='utf-8')
              tag = f'<script src="{script_name}"></script>'
              if tag not in html:
                  html = html.replace('</body>', f'{tag}\n</body>')
              page.write_text(html, encoding='utf-8')
              return html

          html = inject_script('_site/index.html', 'cloud-sync.js')
          inject_script('_site/mom.html', 'cloud-sync.js')

          scripts = re.findall(r'<script(?:[^>]*)>(.*?)</script>', html, re.S)
          for index, script in enumerate(scripts):
              Path(f'_site/inline-{index}.js').write_text(script, encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: |
          node --check _site/inline-0.js
          node --check _site/persistence.js
          node --check _site/cloud-sync.js

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

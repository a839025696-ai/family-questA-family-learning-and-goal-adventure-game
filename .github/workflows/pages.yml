name: Deploy LifeVerse to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          python - <<'PY'
          from pathlib import Path
          import re

          def inject_script(path, script_name):
              page = Path(path)
              html = page.read_text(encoding='utf-8')
              tag = f'<script src="{script_name}"></script>'
              if tag not in html:
                  html = html.replace('</body>', f'{tag}\n</body>')
              page.write_text(html, encoding='utf-8')
              return html

          html = inject_script('_site/index.html', 'cloud-sync.js')
          html = inject_script('_site/index.html', 'world-zones.js')
          html = inject_script('_site/index.html', 'skill-system.js')
          inject_script('_site/mom.html', 'cloud-sync.js')

          scripts = re.findall(r'<script(?:[^>]*)>(.*?)</script>', html, re.S)
          for index, script in enumerate(scripts):
              Path(f'_site/inline-{index}.js').write_text(script, encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            _site/inline-*.js
            _site/app.js
            _site/persistence.js
            _site/cloud-sync.js
            _site/daily-rules.js
            _site/world-zones.js
            _site/skill-system.js
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JavaScript files found to validate."
            exit 1
          fi
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "Checking $file"
              node --check "$file"
            fi
          done

      - name: Verify publishable entry points
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/alex.html
          test -s _site/leo.html
          test -s _site/mom.html
          test -s _site/world-zones.js
          test -s _site/skill-system.js
          grep -q '<meta name="viewport"' _site/index.html
          grep -q 'world-zones.js' _site/index.html
          grep -q 'skill-system.js' _site/index.html

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mom · LifeVerse Reminders</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:#f2f2f7;color:#1c1c1e}button,input,textarea,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(320px,1fr) 390px}.sidebar{background:rgba(246,246,248,.94);backdrop-filter:blur(24px);padding:20px 14px;border-right:1px solid #d8d8dc}.brand{padding:5px 10px 17px}.brand h1{margin:0;font-size:27px}.brand p{margin:4px 0 0;color:#8e8e93;font-size:12px}.search{width:100%;border:0;border-radius:11px;background:#e5e5ea;padding:10px 12px;margin-bottom:15px}.group-title{font-size:11px;color:#8e8e93;font-weight:700;padding:10px 10px 6px;text-transform:uppercase}.list-btn{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;padding:9px 10px;border-radius:10px;cursor:pointer;text-align:left}.list-btn.active{background:#dfe8ff}.left{display:flex;align-items:center;gap:9px}.dot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:14px;box-shadow:inset 0 1px rgba(255,255,255,.35)}.blue{background:#0a84ff}.orange{background:#ff9f0a}.green{background:#30b96b}.purple{background:#9b6dea}.pink{background:#f05f8f}.gray{background:#8e8e93}.count{color:#8e8e93;font-size:12px}.new-list{margin-top:14px;width:100%;border:0;background:transparent;color:#0a84ff;text-align:left;padding:10px;font-weight:600;cursor:pointer}.main{background:#fff;min-width:0}.main-head{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);padding:20px 22px 13px;border-bottom:1px solid #efeff4}.main-head-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.main-head h2{margin:0;font-size:31px}.add{width:36px;height:36px;border-radius:50%;border:0;background:#0a84ff;color:#fff;font-size:24px;cursor:pointer}.filters{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}.chip{border:0;border-radius:999px;background:#f2f2f7;padding:7px 11px;color:#636366;cursor:pointer}.chip.active{background:#e6f1ff;color:#0a84ff}.tasks{padding:6px 18px 80px}.task{display:grid;grid-template-columns:24px 24px 1fr auto;gap:9px;padding:12px 6px;border-bottom:1px solid #efeff4;cursor:pointer;align-items:start}.task.dragging{opacity:.35}.drag{border:0;background:transparent;color:#b0b0b5;font-size:18px;cursor:grab;padding:0;line-height:22px}.circle{width:20px;height:20px;border-radius:50%;border:2px solid #0a84ff;margin-top:1px}.task h3{margin:0;font-size:15px}.task p{margin:4px 0 0;color:#8e8e93;font-size:12px;line-height:1.35}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.badge{font-size:10px;padding:3px 7px;border-radius:999px;background:#f2f2f7;color:#636366}.empty{padding:70px 20px;text-align:center;color:#8e8e93}.detail{background:#f9f9fb;border-left:1px solid #d8d8dc;padding:18px;overflow:auto}.detail-card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 0 rgba(0,0,0,.04)}.detail-card h3{margin:0 0 5px;font-size:20px}.autosave{font-size:11px;color:#30a46c;margin-bottom:12px}.field{margin:11px 0}.field label{display:block;font-size:11px;color:#8e8e93;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:0;border-radius:10px;background:#f2f2f7;padding:10px 11px}.field textarea{min-height:72px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.subtasks{display:grid;gap:7px}.subrow{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center}.subdrag{color:#b0b0b5;cursor:grab}.subrow button{border:0;background:#ffe5e8;color:#ff3b30;border-radius:9px;width:34px;height:34px;cursor:pointer}.smallbtn{border:0;background:#eaf3ff;color:#0a84ff;border-radius:9px;padding:8px 10px;cursor:pointer}.danger{border:0;border-radius:11px;background:#ffe5e8;color:#ff3b30;padding:10px 13px;font-weight:700;cursor:pointer}.actions{display:flex;justify-content:flex-end;margin-top:14px}.toplink{color:#0a84ff;text-decoration:none;font-size:13px}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:#1c1c1e;color:#fff;padding:10px 16px;border-radius:999px;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1050px){.app{grid-template-columns:220px 1fr}.detail{position:fixed;right:0;top:0;bottom:0;width:min(92vw,420px);z-index:10;box-shadow:-20px 0 50px rgba(0,0,0,.12);transform:translateX(105%);transition:.22s}.detail.open{transform:translateX(0)}}@media(max-width:680px){.app{display:block}.sidebar{position:static;border-right:0}.main-head{position:static}.detail{width:100%}.sidebar .lists{display:grid;grid-template-columns:1fr 1fr;gap:4px}.group-title{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><h1>提醒事项</h1><p>LifeVerse · 妈妈任务中心</p></div><input class="search" id="search" placeholder="搜索任务"><div class="lists" id="lists"></div><button class="new-list" onclick="addCategory()">＋ 新建分类</button><div style="padding:14px 10px"><a class="toplink" href="index.html?mode=parent&player=Rina">返回家庭总览 →</a></div></aside>
<main class="main"><div class="main-head"><div class="main-head-top"><div><h2 id="title">今天</h2><div id="subtitle" style="color:#8e8e93;font-size:12px;margin-top:3px"></div></div><button class="add" onclick="newTask()">＋</button></div><div class="filters" id="filters"></div></div><div class="tasks" id="tasks"></div></main>
<aside class="detail" id="detail"><div class="detail-card" id="editor"><div class="empty">选择一个任务进行编辑</div></div></aside>
</div><div class="toast" id="toast"></div>
<script>
const KEY='lifeverseLightV1', PEOPLE=['Alex','Leo'];
const DEFAULT_CATS=[{id:'daily',name:'日常生活',icon:'☀️',color:'blue'},{id:'study',name:'学习任务',icon:'📘',color:'orange'},{id:'interest',name:'兴趣活动',icon:'✨',color:'purple'}];
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{};state.tasksByPlayer=state.tasksByPlayer||{Alex:[],Leo:[]};state.reminderCategories=state.reminderCategories||DEFAULT_CATS;state.reminderMeta=state.reminderMeta||{};
let active='all',person='Alex',selectedId=null,searchText='',saveTimer=null,dragId=null;const bc=('BroadcastChannel'in window)?new BroadcastChannel('lifeverse-sync'):null;
function save(reason='auto'){state.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(state));bc?.postMessage({type:'state-changed',at:state.updatedAt});const a=document.querySelector('.autosave');if(a){a.textContent='✓ 已自动保存';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(a)a.textContent='所有更改都会自动保存'},1200)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function taskId(t){if(!t[5])t[5]='rem-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);return t[5]}
function meta(t,p=person){const id=taskId(t);state.reminderMeta[id]=state.reminderMeta[id]||{category:t[6]||'daily',subtasks:Array.isArray(t[7])?t[7].map((x,i)=>({id:`${id}-s${i}`,text:typeof x==='string'?x:(x.text||''),done:false})):[],notes:t[1]||'',date:'',time:'',repeat:'none',priority:'none',tags:[],person:p,notify:true};const m=state.reminderMeta[id];m.person=m.person||p;m.subtasks=(m.subtasks||[]).map((x,i)=>typeof x==='string'?{id:`${id}-s${i}`,text:x,done:false}:{id:x.id||`${id}-s${i}`,text:x.text||'',done:!!x.done});return m}
function allTasks(){return PEOPLE.flatMap(p=>(state.tasksByPlayer[p]||[]).map(t=>({p,t,m:meta(t,p)})))}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}
function renderLists(){const all=allTasks(),counts={};state.reminderCategories.forEach(c=>counts[c.id]=all.filter(x=>x.m.category===c.id).length);lists.innerHTML=`<div class="group-title">智能列表</div><button class="list-btn ${active==='all'?'active':''}" onclick="setActive('all')"><span class="left"><span class="dot blue">✓</span>全部</span><span class="count">${all.length}</span></button><button class="list-btn ${active==='today'?'active':''}" onclick="setActive('today')"><span class="left"><span class="dot orange">☀</span>今天</span></button><div class="group-title">我的列表</div>`+state.reminderCategories.map(c=>`<button class="list-btn ${active===c.id?'active':''}" onclick="setActive('${c.id}')"><span class="left"><span class="dot ${c.color||'gray'}">${esc(c.icon||'•')}</span>${esc(c.name)}</span><span class="count">${counts[c.id]||0}</span></button>`).join('')}
function renderFilters(){filters.innerHTML=PEOPLE.map(p=>`<button class="chip ${person===p?'active':''}" onclick="setPerson('${p}')">${p}</button>`).join('')}
function isToday(m){const d=new Date(),today=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');if(m.repeat==='daily')return true;if(m.repeat==='weekdays')return d.getDay()>0&&d.getDay()<6;if(m.date===today)return true;return !m.date&&m.repeat==='none'}
function filtered(){let a=(state.tasksByPlayer[person]||[]).map(t=>({t,m:meta(t,person)}));if(active!=='all'&&active!=='today')a=a.filter(x=>x.m.category===active);if(active==='today')a=a.filter(x=>isToday(x.m));if(searchText)a=a.filter(x=>(x.t[0]+' '+x.t[1]+' '+x.m.notes).toLowerCase().includes(searchText.toLowerCase()));return a}
function renderTasks(){const arr=filtered();title.textContent=active==='all'?'全部':active==='today'?'今天':(state.reminderCategories.find(c=>c.id===active)?.name||'任务');subtitle.textContent=`${person} · ${arr.length} 项 · 可拖动排序`;tasks.innerHTML=arr.length?arr.map(({t,m})=>`<div class="task" draggable="true" data-id="${taskId(t)}" ondragstart="dragStart(event)" ondragover="event.preventDefault()" ondrop="dropTask(event)" onclick="if(!event.target.classList.contains('drag'))editTask('${taskId(t)}')"><button class="drag" title="拖动排序">☷</button><span class="circle"></span><div><h3>${esc(t[0])}</h3><p>${esc(m.notes||t[1]||'')}</p><div class="badges"><span class="badge">${esc(state.reminderCategories.find(c=>c.id===m.category)?.name||'未分类')}</span>${m.subtasks.length?`<span class="badge">${m.subtasks.length} 子任务</span>`:''}${m.time?`<span class="badge">⏰ ${m.time}</span>`:''}${m.repeat!=='none'?`<span class="badge">↻ ${esc(m.repeat)}</span>`:''}<span class="badge">+${t[2]} XP</span><span class="badge">+${t[3]} 金币</span></div></div><small>›</small></div>`).join(''):'<div class="empty">这里还没有任务<br><button class="smallbtn" style="margin-top:12px" onclick="newTask()">＋ 新建提醒事项</button></div>'}
function render(){renderLists();renderFilters();renderTasks();if(selectedId)editTask(selectedId,false)}
function setActive(v){active=v;render()}function setPerson(v){person=v;selectedId=null;render()}
function addCategory(){const name=prompt('分类名称，例如：家务、英语、运动');if(!name)return;const icon=prompt('图标或 Emoji','⭐')||'⭐';const id='cat-'+Date.now();state.reminderCategories.push({id,name:name.trim(),icon,color:['green','purple','pink','orange'][state.reminderCategories.length%4]});active=id;save();render()}
function newTask(){const id='rem-'+Date.now();const cat=(active!=='all'&&active!=='today')?active:'daily';const t=['新提醒事项','',20,5,'star',id,cat,[]];(state.tasksByPlayer[person]||(state.tasksByPlayer[person]=[])).push(t);state.reminderMeta[id]={category:cat,subtasks:[],notes:'',date:'',time:'',repeat:'none',priority:'none',tags:[],person,notify:true};selectedId=id;save();render();editTask(id)}
function findTask(id){for(const p of PEOPLE){const i=(state.tasksByPlayer[p]||[]).findIndex(t=>taskId(t)===id);if(i>=0)return{p,i,t:state.tasksByPlayer[p][i],m:meta(state.tasksByPlayer[p][i],p)}}return null}
function editTask(id,open=true){selectedId=id;const x=findTask(id);if(!x)return;if(open)detail.classList.add('open');const cats=state.reminderCategories.map(c=>`<option value="${c.id}" ${x.m.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('');editor.innerHTML=`<h3>提醒事项详情</h3><div class="autosave">所有更改都会自动保存</div><div class="field"><label>标题</label><input id="e-title" value="${esc(x.t[0])}"></div><div class="field"><label>备注</label><textarea id="e-notes" placeholder="说明、要求、链接等">${esc(x.m.notes||'')}</textarea></div><div class="grid2"><div class="field"><label>孩子</label><select id="e-person">${PEOPLE.map(p=>`<option ${p===x.p?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label>分类</label><select id="e-cat">${cats}</select></div></div><div class="grid2"><div class="field"><label>日期</label><input id="e-date" type="date" value="${esc(x.m.date||'')}"></div><div class="field"><label>时间</label><input id="e-time" type="time" value="${esc(x.m.time||'')}"></div></div><div class="grid2"><div class="field"><label>重复</label><select id="e-repeat"><option value="none" ${x.m.repeat==='none'?'selected':''}>不重复</option><option value="daily" ${x.m.repeat==='daily'?'selected':''}>每天</option><option value="weekdays" ${x.m.repeat==='weekdays'?'selected':''}>工作日</option><option value="weekly" ${x.m.repeat==='weekly'?'selected':''}>每周</option><option value="monthly" ${x.m.repeat==='monthly'?'selected':''}>每月</option></select></div><div class="field"><label>提醒</label><select id="e-notify"><option value="yes" ${x.m.notify!==false?'selected':''}>到时间提醒</option><option value="no" ${x.m.notify===false?'selected':''}>不提醒</option></select></div></div><div class="grid2"><div class="field"><label>XP</label><input id="e-xp" type="number" min="0" value="${Number(x.t[2])||0}"></div><div class="field"><label>金币</label><input id="e-coins" type="number" min="0" value="${Number(x.t[3])||0}"></div></div><div class="field"><label>标签（逗号分隔）</label><input id="e-tags" value="${esc((x.m.tags||[]).join(', '))}"></div><div class="field"><label>子任务 · 可拖动排序</label><div class="subtasks" id="subtasks">${x.m.subtasks.map((s,i)=>`<div class="subrow" draggable="true" data-si="${i}" ondragstart="subDragStart(event)" ondragover="event.preventDefault()" ondrop="subDrop(event)"><span class="subdrag">☷</span><input class="subinput" data-i="${i}" value="${esc(s.text)}"><button onclick="removeSub(${i})">×</button></div>`).join('')}</div><button class="smallbtn" style="margin-top:8px" onclick="addSub()">＋ 添加子任务</button></div><div class="actions"><button class="danger" onclick="deleteTask()">删除任务</button></div>`;bindAutoSave()}
function bindAutoSave(){['e-title','e-notes','e-date','e-time','e-xp','e-coins','e-tags'].forEach(id=>document.getElementById(id)?.addEventListener('input',autoSave));['e-person','e-cat','e-repeat','e-notify'].forEach(id=>document.getElementById(id)?.addEventListener('change',autoSave));document.querySelectorAll('.subinput').forEach(el=>el.addEventListener('input',autoSave))}
function autoSave(){const x=findTask(selectedId);if(!x)return;const target=document.getElementById('e-person')?.value||x.p;x.t[0]=document.getElementById('e-title')?.value||'';x.m.notes=document.getElementById('e-notes')?.value||'';x.t[1]=x.m.notes;x.m.category=document.getElementById('e-cat')?.value||'daily';x.t[6]=x.m.category;x.m.date=document.getElementById('e-date')?.value||'';x.m.time=document.getElementById('e-time')?.value||'';x.m.repeat=document.getElementById('e-repeat')?.value||'none';x.m.notify=(document.getElementById('e-notify')?.value!=='no');x.t[2]=Math.max(0,Number(document.getElementById('e-xp')?.value)||0);x.t[3]=Math.max(0,Number(document.getElementById('e-coins')?.value)||0);x.m.tags=(document.getElementById('e-tags')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);x.m.subtasks=[...document.querySelectorAll('.subinput')].map((el,i)=>({id:x.m.subtasks[i]?.id||`${selectedId}-s${Date.now()}-${i}`,text:el.value,done:false}));x.t[7]=x.m.subtasks.map(s=>s.text).filter(Boolean);if(target!==x.p){state.tasksByPlayer[x.p].splice(x.i,1);state.tasksByPlayer[target]=state.tasksByPlayer[target]||[];state.tasksByPlayer[target].push(x.t);x.m.person=target;person=target}save()}
function addSub(){autoSave();const x=findTask(selectedId);if(!x)return;x.m.subtasks.push({id:`${selectedId}-s${Date.now()}`,text:'',done:false});save();editTask(selectedId,false);setTimeout(()=>{const a=document.querySelectorAll('.subinput');a[a.length-1]?.focus()},0)}
function removeSub(i){autoSave();const x=findTask(selectedId);if(!x)return;x.m.subtasks.splice(i,1);x.t[7]=x.m.subtasks.map(s=>s.text).filter(Boolean);save();editTask(selectedId,false)}
function deleteTask(){const x=findTask(selectedId);if(!x||!confirm(`删除「${x.t[0]}」？`))return;state.tasksByPlayer[x.p].splice(x.i,1);delete state.reminderMeta[selectedId];if(state.done)delete state.done[`${x.p}-${selectedId}`];selectedId=null;save();editor.innerHTML='<div class="empty">选择一个任务进行编辑</div>';render()}
function dragStart(e){dragId=e.currentTarget.dataset.id;e.dataTransfer.effectAllowed='move'}
function dropTask(e){e.preventDefault();const targetId=e.currentTarget.dataset.id;if(!dragId||dragId===targetId)return;const arr=state.tasksByPlayer[person]||[],from=arr.findIndex(t=>taskId(t)===dragId),to=arr.findIndex(t=>taskId(t)===targetId);if(from<0||to<0)return;const [item]=arr.splice(from,1);arr.splice(to,0,item);save();render()}
let subFrom=null;function subDragStart(e){subFrom=Number(e.currentTarget.dataset.si)}function subDrop(e){e.preventDefault();const to=Number(e.currentTarget.dataset.si);if(subFrom===null||subFrom===to)return;autoSave();const x=findTask(selectedId);const [item]=x.m.subtasks.splice(subFrom,1);x.m.subtasks.splice(to,0,item);x.t[7]=x.m.subtasks.map(s=>s.text).filter(Boolean);subFrom=null;save();editTask(selectedId,false)}
async function askNotifications(){if(!('Notification'in window))return;if(Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}}
function checkReminders(){if(!('Notification'in window)||Notification.permission!=='granted')return;const now=new Date(),hh=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),stamp=[now.getFullYear(),now.getMonth()+1,now.getDate(),hh].join('-');allTasks().forEach(({p,t,m})=>{if(!m.notify||!m.time||!isToday(m))return;const key=`notice:${taskId(t)}:${stamp}`;if(m.time===hh&&!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');new Notification(`${p} · ${t[0]}`,{body:(m.subtasks||[]).map(s=>'• '+s.text).join('\n')||m.notes||'LifeVerse 任务提醒'})}})}
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){state=JSON.parse(e.newValue)||state;render();toastMsg('已同步最新任务')}});bc&&(bc.onmessage=()=>{const fresh=JSON.parse(localStorage.getItem(KEY)||'null');if(fresh){state=fresh;render()}});document.addEventListener('click',askNotifications,{once:true});setInterval(checkReminders,30000);
search.addEventListener('input',e=>{searchText=e.target.value;renderTasks()});save();render();
</script>
</body></html>

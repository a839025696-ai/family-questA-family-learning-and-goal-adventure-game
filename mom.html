<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mom · LifeVerse Reminders</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:#f2f2f7;color:#1c1c1e}button,input,textarea,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:260px minmax(320px,1fr) 390px}.sidebar{background:rgba(246,246,248,.92);backdrop-filter:blur(24px);padding:22px 14px;border-right:1px solid #d8d8dc}.brand{padding:6px 10px 20px}.brand h1{margin:0;font-size:28px}.brand p{margin:4px 0 0;color:#8e8e93;font-size:12px}.search{width:100%;border:0;border-radius:11px;background:#e5e5ea;padding:10px 12px;margin-bottom:18px}.group-title{font-size:11px;color:#8e8e93;font-weight:700;padding:10px 10px 6px;text-transform:uppercase}.list-btn{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;padding:10px;border-radius:10px;cursor:pointer;text-align:left}.list-btn.active{background:#dfe8ff}.left{display:flex;align-items:center;gap:9px}.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px}.blue{background:#0a84ff}.orange{background:#ff9f0a}.green{background:#30d158}.purple{background:#bf5af2}.pink{background:#ff375f}.gray{background:#8e8e93}.count{color:#8e8e93;font-size:12px}.new-list{margin-top:18px;width:100%;border:0;background:transparent;color:#0a84ff;text-align:left;padding:10px;font-weight:600;cursor:pointer}.main{background:#fff;min-width:0}.main-head{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);padding:22px 24px 14px;border-bottom:1px solid #efeff4}.main-head-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.main-head h2{margin:0;font-size:32px}.add{width:36px;height:36px;border-radius:50%;border:0;background:#0a84ff;color:#fff;font-size:24px;cursor:pointer}.filters{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.chip{border:0;border-radius:999px;background:#f2f2f7;padding:7px 11px;color:#636366;cursor:pointer}.chip.active{background:#e6f1ff;color:#0a84ff}.tasks{padding:6px 18px 80px}.task{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:14px 6px;border-bottom:1px solid #efeff4;cursor:pointer}.task:hover{background:#fafafa}.circle{width:22px;height:22px;border-radius:50%;border:2px solid #0a84ff;margin-top:2px}.task h3{margin:0;font-size:15px}.task p{margin:4px 0 0;color:#8e8e93;font-size:12px;line-height:1.35}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.badge{font-size:10px;padding:3px 7px;border-radius:999px;background:#f2f2f7;color:#636366}.task small{color:#8e8e93}.empty{padding:80px 20px;text-align:center;color:#8e8e93}.detail{background:#f9f9fb;border-left:1px solid #d8d8dc;padding:18px;overflow:auto}.detail-card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 0 rgba(0,0,0,.04)}.detail-card h3{margin:0 0 14px;font-size:20px}.field{margin:12px 0}.field label{display:block;font-size:11px;color:#8e8e93;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:0;border-radius:10px;background:#f2f2f7;padding:10px 11px}.field textarea{min-height:76px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.subtasks{display:grid;gap:7px}.subrow{display:grid;grid-template-columns:1fr auto;gap:6px}.subrow button{border:0;background:#ffe5e8;color:#ff3b30;border-radius:9px;width:34px;cursor:pointer}.smallbtn{border:0;background:#eaf3ff;color:#0a84ff;border-radius:9px;padding:8px 10px;cursor:pointer}.actions{display:flex;gap:8px;margin-top:16px}.primary{flex:1;border:0;border-radius:11px;background:#0a84ff;color:#fff;padding:11px;font-weight:700;cursor:pointer}.danger{border:0;border-radius:11px;background:#ffe5e8;color:#ff3b30;padding:11px 14px;font-weight:700;cursor:pointer}.toplink{color:#0a84ff;text-decoration:none;font-size:13px}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:#1c1c1e;color:#fff;padding:10px 16px;border-radius:999px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1050px){.app{grid-template-columns:220px 1fr}.detail{position:fixed;right:0;top:0;bottom:0;width:min(92vw,420px);z-index:10;box-shadow:-20px 0 50px rgba(0,0,0,.12);transform:translateX(105%);transition:.22s}.detail.open{transform:translateX(0)}}@media(max-width:680px){.app{display:block}.sidebar{position:static;border-right:0}.main-head{position:static}.detail{width:100%}.sidebar .lists{display:grid;grid-template-columns:1fr 1fr;gap:4px}.group-title{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><h1>提醒事项</h1><p>LifeVerse · 妈妈任务中心</p></div>
  <input class="search" id="search" placeholder="搜索任务">
  <div class="lists" id="lists"></div>
  <button class="new-list" onclick="addCategory()">＋ 新建分类</button>
  <div style="padding:14px 10px"><a class="toplink" href="index.html?mode=parent&player=Rina">返回家庭总览 →</a></div>
</aside>
<main class="main">
  <div class="main-head"><div class="main-head-top"><div><h2 id="title">今天</h2><div id="subtitle" style="color:#8e8e93;font-size:12px;margin-top:3px"></div></div><button class="add" onclick="newTask()">＋</button></div><div class="filters" id="filters"></div></div>
  <div class="tasks" id="tasks"></div>
</main>
<aside class="detail" id="detail"><div class="detail-card" id="editor"></div></aside>
</div>
<div class="toast" id="toast"></div>
<script>
const KEY='lifeverseLightV1';
const PEOPLE=['Alex','Leo'];
const DEFAULT_CATS=[
{id:'daily',name:'日常生活',icon:'🏠',color:'blue'},
{id:'study',name:'学习任务',icon:'📚',color:'orange'},
{id:'interest',name:'兴趣活动',icon:'🎨',color:'purple'}
];
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{};
state.tasksByPlayer=state.tasksByPlayer||{Alex:[],Leo:[]};
state.reminderCategories=state.reminderCategories||DEFAULT_CATS;
state.reminderMeta=state.reminderMeta||{};
let active='all',person='Alex',selectedId=null,searchText='';
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function meta(task){const id=task[5];state.reminderMeta[id]=state.reminderMeta[id]||{category:task[6]||'daily',subtasks:Array.isArray(task[7])?task[7].map(x=>typeof x==='string'?{text:x,done:false}:x):[],notes:'',date:'',time:'',repeat:'none',priority:'none',tags:[],person:person};return state.reminderMeta[id]}
function allTasks(){return PEOPLE.flatMap(p=>(state.tasksByPlayer[p]||[]).map(t=>({p,t,m:meta(t)})))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)}
function renderLists(){const counts={};state.reminderCategories.forEach(c=>counts[c.id]=allTasks().filter(x=>x.m.category===c.id).length);lists.innerHTML=`<div class="group-title">智能列表</div><button class="list-btn ${active==='all'?'active':''}" onclick="setActive('all')"><span class="left"><span class="dot blue">✓</span>全部</span><span class="count">${allTasks().length}</span></button><button class="list-btn ${active==='today'?'active':''}" onclick="setActive('today')"><span class="left"><span class="dot orange">☀</span>今天</span></button><div class="group-title">我的列表</div>`+state.reminderCategories.map(c=>`<button class="list-btn ${active===c.id?'active':''}" onclick="setActive('${c.id}')"><span class="left"><span class="dot ${c.color||'gray'}">${esc(c.icon||'•')}</span>${esc(c.name)}</span><span class="count">${counts[c.id]||0}</span></button>`).join('')}
function renderFilters(){filters.innerHTML=PEOPLE.map(p=>`<button class="chip ${person===p?'active':''}" onclick="setPerson('${p}')">${p}</button>`).join('')}
function filtered(){let a=(state.tasksByPlayer[person]||[]).map(t=>({t,m:meta(t)}));if(active!=='all'&&active!=='today')a=a.filter(x=>x.m.category===active);if(active==='today'){const d=new Date().toISOString().slice(0,10);a=a.filter(x=>!x.m.date||x.m.date===d)}if(searchText)a=a.filter(x=>(x.t[0]+' '+x.t[1]+' '+x.m.notes).toLowerCase().includes(searchText.toLowerCase()));return a}
function renderTasks(){const arr=filtered();title.textContent=active==='all'?'全部':active==='today'?'今天':(state.reminderCategories.find(c=>c.id===active)?.name||'任务');subtitle.textContent=`${person} · ${arr.length} 项`;tasks.innerHTML=arr.length?arr.map(({t,m})=>{const subs=m.subtasks||[];return `<div class="task" onclick="editTask('${t[5]}')"><span class="circle"></span><div><h3>${esc(t[0])}</h3><p>${esc(t[1]||m.notes||'')}</p><div class="badges"><span class="badge">${esc(state.reminderCategories.find(c=>c.id===m.category)?.name||'未分类')}</span>${subs.length?`<span class="badge">${subs.length} 个子任务</span>`:''}${m.date?`<span class="badge">📅 ${m.date}</span>`:''}${m.repeat!=='none'?`<span class="badge">↻ ${esc(m.repeat)}</span>`:''}<span class="badge">+${t[2]} XP</span><span class="badge">+${t[3]} 金币</span></div></div><small>›</small></div>`}).join(''):'<div class="empty">这里还没有任务<br><button class="smallbtn" style="margin-top:12px" onclick="newTask()">＋ 新建提醒事项</button></div>'}
function setActive(v){active=v;render()}
function setPerson(v){person=v;render()}
function addCategory(){const name=prompt('分类名称，例如：家务、英语、运动');if(!name)return;const icon=prompt('图标或 Emoji','⭐')||'⭐';const id='cat-'+Date.now();state.reminderCategories.push({id,name:name.trim(),icon,color:['green','purple','pink','orange'][state.reminderCategories.length%4]});save();active=id;render()}
function newTask(){const id='rem-'+Date.now();const cat=(active!=='all'&&active!=='today')?active:'daily';const t=['新提醒事项','',20,5,'star',id,cat,[]];(state.tasksByPlayer[person]||(state.tasksByPlayer[person]=[])).unshift(t);state.reminderMeta[id]={category:cat,subtasks:[],notes:'',date:'',time:'',repeat:'none',priority:'none',tags:[],person};save();selectedId=id;render();editTask(id)}
function findTask(id){for(const p of PEOPLE){const i=(state.tasksByPlayer[p]||[]).findIndex(t=>t[5]===id);if(i>=0)return{p,i,t:state.tasksByPlayer[p][i],m:meta(state.tasksByPlayer[p][i])}}return null}
function editTask(id){selectedId=id;const x=findTask(id);if(!x)return;detail.classList.add('open');const cats=state.reminderCategories.map(c=>`<option value="${c.id}" ${x.m.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('');editor.innerHTML=`<h3>提醒事项详情</h3><div class="field"><label>标题</label><input id="e-title" value="${esc(x.t[0])}"></div><div class="field"><label>备注</label><textarea id="e-notes" placeholder="可以写说明、要求、链接等">${esc(x.m.notes||x.t[1]||'')}</textarea></div><div class="grid2"><div class="field"><label>孩子</label><select id="e-person">${PEOPLE.map(p=>`<option ${p===x.p?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label>分类</label><select id="e-cat">${cats}</select></div></div><div class="grid2"><div class="field"><label>日期</label><input id="e-date" type="date" value="${esc(x.m.date||'')}"></div><div class="field"><label>时间</label><input id="e-time" type="time" value="${esc(x.m.time||'')}"></div></div><div class="grid2"><div class="field"><label>重复</label><select id="e-repeat"><option value="none">不重复</option><option value="daily" ${x.m.repeat==='daily'?'selected':''}>每天</option><option value="weekdays" ${x.m.repeat==='weekdays'?'selected':''}>工作日</option><option value="weekly" ${x.m.repeat==='weekly'?'selected':''}>每周</option><option value="monthly" ${x.m.repeat==='monthly'?'selected':''}>每月</option><option value="custom" ${x.m.repeat==='custom'?'selected':''}>自定义</option></select></div><div class="field"><label>优先级</label><select id="e-priority"><option value="none">无</option><option value="low" ${x.m.priority==='low'?'selected':''}>低</option><option value="medium" ${x.m.priority==='medium'?'selected':''}>中</option><option value="high" ${x.m.priority==='high'?'selected':''}>高</option></select></div></div><div class="grid2"><div class="field"><label>XP</label><input id="e-xp" type="number" min="0" value="${x.t[2]||0}"></div><div class="field"><label>金币</label><input id="e-coins" type="number" min="0" value="${x.t[3]||0}"></div></div><div class="field"><label>标签（逗号分隔）</label><input id="e-tags" value="${esc((x.m.tags||[]).join(', '))}" placeholder="数学, 家务, 运动"></div><div class="field"><label>子任务</label><div class="subtasks" id="subtasks">${(x.m.subtasks||[]).map((s,i)=>`<div class="subrow"><input data-sub="${i}" value="${esc(s.text||s)}"><button onclick="removeSub(${i})">−</button></div>`).join('')}</div><button class="smallbtn" style="margin-top:8px" onclick="addSub()">＋ 添加子任务</button></div><div class="actions"><button class="primary" onclick="saveEditor()">保存提醒事项</button><button class="danger" onclick="deleteTask()">删除</button></div>`}
function currentSubs(){return [...document.querySelectorAll('[data-sub]')].map(i=>({text:i.value.trim(),done:false})).filter(x=>x.text)}
function addSub(){const e=document.createElement('div');e.className='subrow';e.innerHTML='<input data-sub="new" placeholder="输入子任务"><button onclick="this.parentElement.remove()">−</button>';subtasks.appendChild(e);e.querySelector('input').focus()}
function removeSub(i){const x=findTask(selectedId);if(!x)return;x.m.subtasks.splice(i,1);save();editTask(selectedId)}
function saveEditor(){const x=findTask(selectedId);if(!x)return;const newPerson=document.getElementById('e-person').value;x.t[0]=document.getElementById('e-title').value.trim()||'未命名任务';x.m.notes=document.getElementById('e-notes').value.trim();x.t[1]=x.m.notes;x.m.category=document.getElementById('e-cat').value;x.t[6]=x.m.category;x.m.date=document.getElementById('e-date').value;x.m.time=document.getElementById('e-time').value;x.m.repeat=document.getElementById('e-repeat').value;x.m.priority=document.getElementById('e-priority').value;x.m.tags=document.getElementById('e-tags').value.split(',').map(s=>s.trim()).filter(Boolean);x.m.subtasks=currentSubs();x.t[7]=x.m.subtasks.map(s=>s.text);x.t[2]=Math.max(0,Number(document.getElementById('e-xp').value)||0);x.t[3]=Math.max(0,Number(document.getElementById('e-coins').value)||0);if(newPerson!==x.p){state.tasksByPlayer[x.p].splice(x.i,1);(state.tasksByPlayer[newPerson]||(state.tasksByPlayer[newPerson]=[])).unshift(x.t);x.m.person=newPerson;person=newPerson}save();render();editTask(selectedId);toast('已保存')}
function deleteTask(){const x=findTask(selectedId);if(!x||!confirm('删除这个提醒事项？'))return;state.tasksByPlayer[x.p].splice(x.i,1);delete state.reminderMeta[selectedId];delete state.done?.[`${x.p}-${selectedId}`];save();selectedId=null;detail.classList.remove('open');render();toast('已删除')}
function render(){renderLists();renderFilters();renderTasks()}
search.addEventListener('input',e=>{searchText=e.target.value;renderTasks()});
render();
</script>
</body></html>
